---
collections:
  - name: ansible.posix
    version: ">=1.5.0"
  # proxmox_kvm / proxmox_vm_info, used by the proxmox_vm and vm_identity
  # roles. Declared in galaxy.yml but previously not installed here, so both
  # roles worked only by accident of the system-wide package.
  # Below 11, which moved the proxmox modules to community.proxmox.
  - name: community.general
    version: ">=8.0.0,<11.0.0"
  # openssl_privatekey_pipe / openssl_csr_pipe, in the CA playbooks.
  - name: community.crypto
    version: ">=2.0.0"
# deevnet.builder and deevnet.net are needed too (site_trust, substrate_cert,
# proxmox_node_cert, opnsense_cert): `make publish` in each repository
# installs them at the user level. CI installs them from GitHub.
