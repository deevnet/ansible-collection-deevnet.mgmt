---
# Tenant downloads' TLS certificate from the Substrate CA (ADR-0031 §4), through site_cert.
# nginx serves the tree, and the site root itself, over it.
#
# site_cert signs it on the CONTROL NODE: this VM needs no path to anything.
- name: Issue Tenant downloads' certificate
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ tenant_downloads_tls_dir }}"
    site_cert_key_owner: root
    site_cert_common_name: "{{ tenant_downloads_tls_common_name }}"
    site_cert_alt_names: "{{ tenant_downloads_tls_alt_names }}"
    site_cert_ips: "{{ [tenant_downloads_tls_ip] }}"
    site_cert_renew_before: "{{ tenant_downloads_tls_renew_before }}"
    site_cert_notify: restart tenant downloads
