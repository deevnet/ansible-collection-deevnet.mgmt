---
# Tenant downloads on the observability store (CHG-0025). Static files the
# Builder curates, pushed here and served read-only to DVNTM-TD through the
# host's service proxy (ADR-0036).

- name: Refuse to put the downloads on the OS disk
  ansible.builtin.assert:
    that: >-
      ansible_facts.mounts | selectattr('mount', 'equalto', '/srv') | list | length == 1
    fail_msg: >-
      /srv is not a mountpoint on {{ inventory_hostname }}. The downloads (a Pi
      image alone is a gigabyte) belong on the data disk.
    quiet: true

- name: Check the tree is staged on the control node
  ansible.builtin.stat:
    path: "{{ tenant_downloads_source }}"
  register: tenant_downloads_source_stat
  delegate_to: localhost
  become: false

- name: Refuse to run without the tree
  ansible.builtin.assert:
    that: tenant_downloads_source_stat.stat.isdir | default(false)
    fail_msg: >-
      {{ tenant_downloads_source }} is not on the control node. Stage it with the
      deevnet.builder artifacts role (--tags fetched-artifacts), the provider's
      `make stage` and the image factory's `make pi-backend-publish`.
    quiet: true

- name: Install rsync, which the push needs at both ends
  ansible.builtin.dnf:
    name: rsync
    state: present
  become: true

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ tenant_downloads_root }}"
    - "{{ tenant_downloads_content_dir }}"
    - "{{ tenant_downloads_conf_dir }}"
  become: true

# This server held its own certificate until CHG-0046. The service proxy holds
# the host's now, and the old key is not left on the disk for nothing to read.
- name: Remove the downloads server's retired certificate and key
  ansible.builtin.file:
    path: "{{ tenant_downloads_retired_tls_dir }}"
    state: absent
  become: true

# Mirrors the Builder's tree exactly: a file removed there is removed here, so
# nothing stale stays downloadable. Root-owned and world-readable; the
# container mounts it read-only.
- name: Push the tree from the Builder
  ansible.posix.synchronize:
    src: "{{ tenant_downloads_source }}"
    dest: "{{ tenant_downloads_content_dir }}/"
    delete: true
    checksum: false
    rsync_opts:
      - "--chmod=D0755,F0644"
      - "--chown=root:root"
  become: true

# Each root on its own, under its own name, for tenants to fetch: during a
# re-root there are two, and a tenant must be able to check one root's
# fingerprint.
- name: Make the directory for the served roots
  ansible.builtin.file:
    path: "{{ tenant_downloads_roots_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Place each root to serve
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ tenant_downloads_roots_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ tenant_downloads_roots }}"
  become: true
  notify: restart tenant downloads

- name: Remove retired roots
  ansible.builtin.file:
    path: "{{ tenant_downloads_roots_dir }}/{{ item }}"
    state: absent
  loop: "{{ site_root_ca_retired | default([]) }}"
  become: true
  notify: restart tenant downloads

# The roots directory is mounted :Z, whose label podman applies only when it
# creates the container; files added later must be given it (as site_cert does).
- name: Give the served roots their directory's SELinux label
  ansible.builtin.shell:
    cmd: |
      selinuxenabled 2>/dev/null || exit 0
      for f in *; do
        [ -e "$f" ] || continue
        if [ "$(stat -c %C "$f")" != "$(stat -c %C .)" ]; then
          chcon --reference=. "$f" && echo "relabeled $f"
        fi
      done
    chdir: "{{ tenant_downloads_roots_dir }}"
  register: tenant_downloads_relabel
  changed_when: tenant_downloads_relabel.stdout | length > 0
  become: true
  notify: restart tenant downloads

- name: Write the server configuration
  ansible.builtin.template:
    src: tenant-downloads.conf.j2
    dest: "{{ tenant_downloads_conf_dir }}/tenant-downloads.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart tenant downloads

- name: Run the downloads server
  ansible.builtin.include_role:
    name: deevnet.mgmt.podman_service
  vars:
    podman_service_name: "{{ tenant_downloads_container_name }}"
    podman_service_description: "Tenant developer downloads (CHG-0025)"
    podman_service_image: "{{ tenant_downloads_image }}"
    podman_service_tarball: "{{ tenant_downloads_tarball }}"
    podman_service_network: host
    podman_service_volumes:
      - "{{ tenant_downloads_content_dir }}:/content:ro,Z"
      # The DIRECTORY replaces the image's conf.d, so its default server on
      # port 80 is never loaded.
      - "{{ tenant_downloads_conf_dir }}:/etc/nginx/conf.d:ro,Z"
      - "{{ tenant_downloads_roots_dir }}:/roots:ro,Z"
    # No podman_service_firewall_ports: the server listens on loopback only.
    # The service proxy opens what tenants reach.

- name: Restart now if the roots or the configuration changed
  ansible.builtin.meta: flush_handlers

- name: Wait for the index to answer
  ansible.builtin.uri:
    url: "{{ tenant_downloads_local_url }}/"
  register: tenant_downloads_index
  retries: 20
  delay: 2
  until: tenant_downloads_index.status == 200
  become: true

- name: Confirm a write is refused
  ansible.builtin.uri:
    url: "{{ tenant_downloads_local_url }}/probe"
    method: PUT
    body: "x"
    status_code: [403, 405]
  become: true

# What tenants are told to trust must be the inventory's roots, each under its
# own name.
- name: Fetch each root as a tenant would
  ansible.builtin.uri:
    url: "{{ tenant_downloads_local_url }}/{{ item | basename }}"
    return_content: true
  loop: "{{ tenant_downloads_roots }}"
  register: tenant_downloads_served_root
  become: true

- name: Confirm each served root is the inventory's
  ansible.builtin.assert:
    that: (item.content | trim) == (lookup('file', item.item) | trim)
    fail_msg: "/{{ item.item | basename }} does not serve {{ item.item }}"
    quiet: true
  loop: "{{ tenant_downloads_served_root.results }}"
  loop_control:
    label: "{{ item.item | basename }}"

- name: Report what is served
  ansible.builtin.debug:
    msg: "Tenant downloads: {{ tenant_downloads_local_url }}, served as https://{{ tenant_downloads_service_name }}/ by the service proxy"
