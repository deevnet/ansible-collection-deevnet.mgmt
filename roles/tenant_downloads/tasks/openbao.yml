---
# Tenant downloads' TLS certificate from the site CA (ADR-0030), through site_cert.
# nginx serves the tree, and the site root itself, over it.
#
# site_cert talks to OpenBao from the CONTROL NODE, against the pinned listener
# certificate, as Ansible's own AppRole - this VM has no path to OpenBao and
# must not need one.
- name: Issue Tenant downloads' certificate
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ tenant_downloads_tls_dir }}"
    site_cert_key_owner: root
    site_cert_common_name: "{{ tenant_downloads_tls_common_name }}"
    site_cert_alt_names: "{{ tenant_downloads_tls_alt_names }}"
    site_cert_ips: "{{ [tenant_downloads_tls_ip] }}"
    site_cert_ttl: "{{ tenant_downloads_tls_ttl }}"
    site_cert_renew_before: "{{ tenant_downloads_tls_renew_before }}"
    site_cert_notify: restart tenant downloads
    site_cert_openbao_addr: "{{ tenant_downloads_openbao_addr }}"
    site_cert_openbao_ca_local: "{{ tenant_downloads_openbao_ca_local }}"
    site_cert_openbao_role_id: "{{ tenant_downloads_openbao_ansible_role_id }}"
    site_cert_openbao_secret_id: "{{ tenant_downloads_openbao_ansible_secret_id }}"
    site_cert_pki_mount: "{{ tenant_downloads_openbao_pki_mount }}"
    site_cert_pki_role: "{{ tenant_downloads_openbao_pki_role }}"
