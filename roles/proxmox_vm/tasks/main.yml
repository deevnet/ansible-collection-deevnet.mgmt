---
# The VM does not exist yet, so every PVE call is delegated to the control node
# and talks to the hypervisor's API. Only the final reachability check runs
# against the guest itself.

- name: Assert the host declares a VM specification
  ansible.builtin.assert:
    that:
      - mgmt_vm is defined
      - mgmt_vm.node is defined
      - mgmt_vm.vmid is defined
      - proxmox_vm_mac is defined
      - proxmox_vm_mac | length > 0
    fail_msg: >-
      {{ inventory_hostname }} has no usable mgmt_vm block. A management-plane
      VM needs mgmt_vm.node, mgmt_vm.vmid and a declared MAC at
      infrastructure.interfaces.eth0.mac (the DHCP reservation and the DNS
      record both key off that MAC).
    success_msg: "VM specification present for {{ inventory_hostname }}."

- name: Look up VMs on {{ proxmox_vm_node }}
  community.general.proxmox_vm_info:
    api_host: "{{ proxmox_vm_api_host }}"
    api_user: "{{ proxmox_vm_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_vm_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_vm_api_token_secret }}"
    validate_certs: "{{ proxmox_vm_api_validate_certs }}"
    node: "{{ proxmox_vm_node }}"
    type: qemu
  delegate_to: localhost
  become: false
  register: proxmox_vm_inventory

# version_sort, not sort: names are fedora-server-<release>-<build>, so a plain
# lexicographic sort puts 44-1.9 above 44-1.10 and picks the older template the
# moment a build number reaches double digits. The same trap applies to the
# release: 9 sorts above 10.
- name: Select the newest template matching {{ proxmox_vm_template_prefix }}
  ansible.builtin.set_fact:
    proxmox_vm_template: >-
      {{
        proxmox_vm_inventory.proxmox_vms
        | selectattr('template', 'defined')
        | selectattr('template', 'equalto', 1)
        | selectattr('name', 'defined')
        | selectattr('name', 'match', '^' ~ proxmox_vm_template_prefix)
        | map(attribute='name')
        | community.general.version_sort
        | last
        | default('')
      }}

- name: Fail clearly when no template matches
  ansible.builtin.assert:
    that:
      - proxmox_vm_template | length > 0
    fail_msg: >-
      No template on node {{ proxmox_vm_node }} whose name starts with
      '{{ proxmox_vm_template_prefix }}'. Build one first:
      `make proxmox-fedora-pve1` in deevnet-image-factory.
    success_msg: "Cloning from template {{ proxmox_vm_template }}."

- name: Determine whether {{ proxmox_vm_name }} already exists
  ansible.builtin.set_fact:
    proxmox_vm_exists: >-
      {{
        proxmox_vm_inventory.proxmox_vms
        | selectattr('name', 'defined')
        | selectattr('name', 'equalto', proxmox_vm_name)
        | list | length > 0
      }}

# Guarded rather than relying on the module's own clone idempotency: a clone is
# a create-once operation and a second one would collide on vmid.
- name: Clone {{ proxmox_vm_template }} into {{ proxmox_vm_name }}
  community.general.proxmox_kvm:
    api_host: "{{ proxmox_vm_api_host }}"
    api_user: "{{ proxmox_vm_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_vm_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_vm_api_token_secret }}"
    validate_certs: "{{ proxmox_vm_api_validate_certs }}"
    node: "{{ proxmox_vm_node }}"
    clone: "{{ proxmox_vm_template }}"
    name: "{{ proxmox_vm_name }}"
    newid: "{{ proxmox_vm_id }}"
    storage: "{{ proxmox_vm_storage }}"
    full: true
    timeout: "{{ proxmox_vm_boot_timeout }}"
    state: present
  delegate_to: localhost
  become: false
  when: not proxmox_vm_exists

- name: Configure {{ proxmox_vm_name }} hardware, MAC and cloud-init
  community.general.proxmox_kvm:
    api_host: "{{ proxmox_vm_api_host }}"
    api_user: "{{ proxmox_vm_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_vm_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_vm_api_token_secret }}"
    validate_certs: "{{ proxmox_vm_api_validate_certs }}"
    node: "{{ proxmox_vm_node }}"
    vmid: "{{ proxmox_vm_id }}"
    cores: "{{ proxmox_vm_cores }}"
    memory: "{{ proxmox_vm_memory }}"
    agent: "enabled=1"
    # The declared MAC is the whole point: the Kea reservation and the A record
    # key off it, so the address survives a rebuild.
    net:
      net0: "virtio={{ proxmox_vm_mac }},bridge={{ proxmox_vm_bridge }}"
    ipconfig:
      ipconfig0: "{{ proxmox_vm_ipconfig }}"
    ciuser: "{{ proxmox_vm_ciuser }}"
    sshkeys: "{{ proxmox_vm_sshkeys }}"
    nameservers: "{{ proxmox_vm_nameserver }}"
    searchdomains: "{{ proxmox_vm_searchdomain }}"
    update: true
    # Without this the module SILENTLY DROPS net and reports changed anyway.
    # proxmox_kvm deletes net/virtio/ide/sata/scsi from an update payload
    # unless update_unsafe is set - and its docs give changing the MAC as the
    # very reason ("Per example updating net update the MAC address"), which is
    # precisely what this role exists to do. Without it the clone keeps the
    # random MAC PVE generated, the Kea reservation never matches, and the guest
    # comes up on a pool address.
    # Safe here because this task passes no disk parameters at all - the only
    # thing the flag unlocks is net0.
    update_unsafe: true
    state: present
  delegate_to: localhost
  become: false

# Attached before the first boot, so the guest sees the disk on the same boot that
# the data_disk role partitions and mounts it on.
#
# `create: regular` means create-if-absent: on a re-run it updates options on the
# existing disk and does NOT re-create or resize it, so the data is safe. Never use
# `create: forced` here - that detaches the existing disk and builds a new one,
# which reads as "make sure it exists" and behaves as "throw the old one away".
# Growing the disk later is a deliberate one-off with state: resized, not this task.
- name: Attach the data disk to {{ proxmox_vm_name }}
  community.general.proxmox_disk:
    api_host: "{{ proxmox_vm_api_host }}"
    api_user: "{{ proxmox_vm_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_vm_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_vm_api_token_secret }}"
    validate_certs: "{{ proxmox_vm_api_validate_certs }}"
    vmid: "{{ proxmox_vm_id }}"
    disk: "{{ proxmox_vm_data_disk.device }}"
    storage: "{{ proxmox_vm_data_disk.storage }}"
    size: "{{ proxmox_vm_data_disk.size }}"
    serial: "{{ proxmox_vm_data_disk_serial }}"
    create: regular
    backup: false
    state: present
  delegate_to: localhost
  become: false
  when: proxmox_vm_data_disk | length > 0

# The configure task reports `changed` from the API call, not from the guest's
# resulting config. If net0 silently kept the MAC the clone inherited from the
# template, the Kea reservation would point at an address nothing asks for, and
# the first sign of it would be wait_for_connection timing out several minutes
# later with nothing to say about why. Read the value back instead.
#
# `pending` rather than `current`: a stopped VM applies config immediately, but
# a re-run against a running one would leave the change pending, and either way
# this asks "what will this VM boot with".
- name: Read back {{ proxmox_vm_name }}'s configuration
  community.general.proxmox_vm_info:
    api_host: "{{ proxmox_vm_api_host }}"
    api_user: "{{ proxmox_vm_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_vm_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_vm_api_token_secret }}"
    validate_certs: "{{ proxmox_vm_api_validate_certs }}"
    node: "{{ proxmox_vm_node }}"
    vmid: "{{ proxmox_vm_id }}"
    type: qemu
    config: pending
  delegate_to: localhost
  become: false
  register: proxmox_vm_readback

- name: Assert net0 carries the declared MAC
  vars:
    # PVE returns the MAC upper-cased inside the net0 string
    # ("virtio=02:DE:20:00:00:C8,bridge=vmbr0"), so both sides are folded.
    proxmox_vm_net0: >-
      {{
        proxmox_vm_readback.proxmox_vms
        | default([])
        | selectattr('config', 'defined')
        | map(attribute='config')
        | map(attribute='net0', default='')
        | first
        | default('')
      }}
  ansible.builtin.assert:
    that:
      - proxmox_vm_net0 | length > 0
      - proxmox_vm_mac | lower in proxmox_vm_net0 | lower
    fail_msg: >-
      {{ proxmox_vm_name }} (vmid {{ proxmox_vm_id }}) has net0
      '{{ proxmox_vm_net0 | default('<absent>') }}', which does not carry the
      declared MAC {{ proxmox_vm_mac }}. The DHCP reservation and the A record
      both key off that MAC, so the VM must not be started in this state.
    success_msg: "net0 carries {{ proxmox_vm_mac }}."

# Same argument as the MAC assert above: the API reporting `changed` is not
# evidence the disk is there. A missing data disk is worse than a loud failure -
# the guest-side role would mount nothing, and the artifact mirror would quietly
# fill the 32G OS disk instead.
- name: Assert the data disk is attached with its serial
  vars:
    proxmox_vm_data_dev: >-
      {{
        proxmox_vm_readback.proxmox_vms
        | default([])
        | selectattr('config', 'defined')
        | map(attribute='config')
        | map(attribute=proxmox_vm_data_disk.device, default='')
        | first
        | default('')
      }}
  ansible.builtin.assert:
    that:
      - proxmox_vm_data_dev | length > 0
      - proxmox_vm_data_disk.storage in proxmox_vm_data_dev
      - "'serial=' ~ proxmox_vm_data_disk_serial in proxmox_vm_data_dev"
    fail_msg: >-
      {{ proxmox_vm_name }} has no usable data disk at
      {{ proxmox_vm_data_disk.device }} (got
      '{{ proxmox_vm_data_dev | default('<absent>') }}'). Without the serial the
      guest cannot find the disk by a stable path.
    success_msg: >-
      {{ proxmox_vm_data_disk.device }} is attached with serial
      {{ proxmox_vm_data_disk_serial }}.
  when: proxmox_vm_data_disk | length > 0

# Placed here on purpose, in both directions. It is AFTER the readback, so the
# guard below gets the current size out of a config we already fetched - no extra
# API call. And it is BEFORE Start, so cloud-init's growpart sees the larger disk
# on the guest's very first boot and there is never a moment where the VM is
# running on a disk we intended to grow.
- name: Assert the OS disk is not being shrunk
  vars:
    _os_disk_cfg: >-
      {{ proxmox_vm_readback.proxmox_vms | default([])
         | selectattr('config', 'defined') | map(attribute='config')
         | map(attribute=proxmox_vm_os_disk_device, default='') | first | default('') }}
    # regex_search returns None on no match, and `None | first` raises - hence
    # default([], true) before first. A size PVE reports in some unit other than G
    # parses as 0, which disables the guard rather than blowing up on a shape we
    # did not anticipate.
    _os_disk_current: >-
      {{ (_os_disk_cfg | regex_search('size=(\d+)G', '\1')
          | default([], true) | first | default(0)) | int }}
  ansible.builtin.assert:
    that:
      - _os_disk_current | int == 0 or proxmox_vm_os_disk_size | int >= _os_disk_current | int
    fail_msg: >-
      {{ proxmox_vm_name }}'s {{ proxmox_vm_os_disk_device }} is
      {{ _os_disk_current }}G and os_disk_size asks for
      {{ proxmox_vm_os_disk_size }}G. PVE can grow a disk but cannot shrink one -
      the API refuses, and doing it by hand means rebuilding the guest. Raise the
      number, or drop it to keep the current size.
    success_msg: >-
      {{ proxmox_vm_os_disk_device }} is {{ _os_disk_current }}G, growing to
      {{ proxmox_vm_os_disk_size }}G.
  when: proxmox_vm_os_disk_size | int > 0

- name: Grow the OS disk to {{ proxmox_vm_os_disk_size }}G
  community.general.proxmox_disk:
    api_host: "{{ proxmox_vm_api_host }}"
    api_user: "{{ proxmox_vm_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_vm_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_vm_api_token_secret }}"
    validate_certs: "{{ proxmox_vm_api_validate_certs }}"
    vmid: "{{ proxmox_vm_id }}"
    disk: "{{ proxmox_vm_os_disk_device }}"
    # The trailing G is REQUIRED, and is the whole of this task's idempotency.
    # proxmox_disk's resize path compares the requested size against PVE's config
    # string by EXACT STRING EQUALITY (`if size == actual_size`), and PVE reports
    # "size=64G". Pass a bare "64" and it never matches, so this resizes on every
    # single run - which on a disk means real work, not just a red herring in the
    # play recap.
    size: "{{ proxmox_vm_os_disk_size }}G"
    state: resized
  delegate_to: localhost
  become: false
  when: proxmox_vm_os_disk_size | int > 0

- name: Start {{ proxmox_vm_name }}
  community.general.proxmox_kvm:
    api_host: "{{ proxmox_vm_api_host }}"
    api_user: "{{ proxmox_vm_api_token_id.split('!')[0] }}"
    api_token_id: "{{ proxmox_vm_api_token_id.split('!')[1] }}"
    api_token_secret: "{{ proxmox_vm_api_token_secret }}"
    validate_certs: "{{ proxmox_vm_api_validate_certs }}"
    node: "{{ proxmox_vm_node }}"
    vmid: "{{ proxmox_vm_id }}"
    state: started
  delegate_to: localhost
  become: false

# Asserts the outcome, not the API call: the guest booted, got its reserved
# address and accepts the automation key.
- name: Wait for {{ proxmox_vm_name }} to answer on SSH
  ansible.builtin.wait_for_connection:
    timeout: "{{ proxmox_vm_boot_timeout }}"

- name: Gather facts now the guest is up
  ansible.builtin.setup:

- name: Assert the guest came up on its reserved address
  ansible.builtin.assert:
    that:
      - env.interfaces.eth0.ip in ansible_all_ipv4_addresses
    fail_msg: >-
      {{ proxmox_vm_name }} booted but is not on {{ env.interfaces.eth0.ip }}
      (has {{ ansible_all_ipv4_addresses | join(', ') }}). The DHCP reservation
      for {{ proxmox_vm_mac }} is missing or points elsewhere - run the
      opnsense_dhcp role against the core router.
    success_msg: "{{ proxmox_vm_name }} is up on {{ env.interfaces.eth0.ip }}."
