---
# One service's TLS certificate from the site's Substrate CA (ADR-0031 §4),
# signed on the control node by deevnet.builder.substrate_cert. Included by
# each role that serves TLS; the caller sets the names and paths, this role
# decides whether to issue and writes the files.

# Where the files go on the host, and what they are called there.
site_cert_dir: ""
# Leaf, then the Substrate CA and the Site CA: the chain the service serves.
site_cert_cert_file: cert.pem
site_cert_key_file: key.pem
# The Deevnet Root CA, the only trust anchor (ADR-0031 §1).
site_cert_ca_file: "{{ site_root_ca_name }}"
# The CA's name before CHG-0031, removed once the root is beside it.
site_cert_old_ca_file: site-ca.pem
# Append the root to the served chain. Only for a product that insists on the
# whole chain in one file: the Omada image builds its keystore from it.
site_cert_chain_includes_root: false
# The container user that reads the key; the certificate and root are 0644.
site_cert_key_owner: root

# What the certificate names. The CN is what clients dial.
site_cert_common_name: ""
site_cert_alt_names: []
site_cert_ips: []

# One year, reissued by any run with fewer than 60 days left (standard §4).
site_cert_days: 365
site_cert_renew_before: 5184000

# The handler the caller wants run when anything here changes.
site_cert_notify: []

# The Deevnet Root CA on the control node, from the inventory.
site_cert_root_local: "{{ site_root_ca_file }}"
# What goes in the CA file beside the certificate: the root, and during a
# re-root the outgoing root too.
# One line, double-quoted: in a folded scalar the '\n' stays literal.
site_cert_ca_bundle: "{{ query('file', *([site_cert_root_local] + (site_root_ca_previous_files | default([])))) | map('trim') | join('\n') ~ '\n' }}"
# Old CA file names to remove, relative to site_cert_dir.
site_cert_retired_ca_files: "{{ site_root_ca_retired | default([]) }}"
