---
# One service's TLS certificate from the site CA (ADR-0030). Included by each
# role that serves TLS; the caller sets the names and paths, this role decides
# whether to issue and writes the files.

# Where the files go on the host, and what they are called there.
site_cert_dir: ""
# Leaf, then intermediate: the full chain the service serves (ADR-0030 §4).
site_cert_cert_file: cert.pem
site_cert_key_file: key.pem
# The site root, the only trust anchor (ADR-0030 §4).
site_cert_ca_file: "{{ site_root_ca_name }}"
# The CA's name before CHG-0031, removed once the root is beside it.
site_cert_old_ca_file: site-ca.pem
# Append the root to the served chain. Only for a product that insists on the
# whole chain in one file: the Omada image builds its keystore from it.
site_cert_chain_includes_root: false
# The container user that reads the key; the certificate and root are 0644.
site_cert_key_owner: root

# What the certificate names. The CN is what clients dial.
site_cert_common_name: ""
site_cert_alt_names: []
site_cert_ips: []

# One year, reissued by any run with fewer than 60 days left (ADR-0030 §5).
site_cert_ttl: 8760h
site_cert_renew_before: 5184000

# The handler the caller wants run when anything here changes.
site_cert_notify: []

# The site root on the control node, from the inventory.
site_cert_root_local: "{{ site_root_ca_file }}"

# OpenBao, reached from the CONTROL NODE against the pinned listener, as
# Ansible's AppRole. The service host needs no path to OpenBao.
site_cert_openbao_addr: ""
site_cert_openbao_ca_local: ""
site_cert_openbao_role_id: "{{ vault_openbao_ansible_role_id | default('') }}"
site_cert_openbao_secret_id: "{{ vault_openbao_ansible_secret_id | default('') }}"
site_cert_pki_mount: pki
site_cert_pki_role: platform
