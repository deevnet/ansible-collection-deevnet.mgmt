---
- name: Fail early if the certificate is not fully described
  ansible.builtin.assert:
    that:
      - site_cert_dir | length > 0
      - site_cert_common_name | length > 0
    fail_msg: site_cert needs site_cert_dir and site_cert_common_name from the calling role.
    quiet: true

- name: Create the certificate directory
  ansible.builtin.file:
    path: "{{ site_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# The Deevnet Root CA, from the inventory: the only trust anchor (ADR-0031 §1).
# During a re-root the file also holds the outgoing root
# (site_root_ca_previous_files), so the service's own client calls keep
# working while its peers move to the new chain one by one.
- name: Install the Deevnet Root CA
  ansible.builtin.copy:
    content: "{{ site_cert_ca_bundle }}"
    dest: "{{ site_cert_dir }}/{{ site_cert_ca_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: "{{ site_cert_notify }}"

- name: Check whether the certificate is still valid for long enough
  ansible.builtin.command:
    argv: [openssl, x509, -checkend, "{{ site_cert_renew_before }}", -noout,
           -in, "{{ site_cert_dir }}/{{ site_cert_cert_file }}"]
  register: site_cert_expiry
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

# Expiry is not the only reason to reissue. A certificate from a CA that has
# since been replaced (a re-root, a rotated issuing CA, the old OpenBao
# intermediate) stays valid for its term and chains to nothing a client
# trusts - the lesson of INC-0003. The certificate file holds the leaf then
# the issuing and Site CAs, so the same file is the untrusted link.
- name: Read the certificate
  ansible.builtin.slurp:
    src: "{{ site_cert_dir }}/{{ site_cert_cert_file }}"
  register: site_cert_current
  failed_when: false
  become: true

# Against the new root alone, on the control node: a certificate under the
# outgoing root is reissued even while that root is still trusted.
- name: Check whether the certificate chains to the Deevnet Root CA
  ansible.builtin.shell:
    cmd: >-
      f=$(mktemp) && cat > "$f" &&
      openssl verify -no-CApath -no-CAstore -CAfile {{ site_cert_root_local | quote }} -untrusted "$f" "$f";
      rc=$?; rm -f "$f"; exit $rc
    stdin: "{{ (site_cert_current.content | b64decode) if site_cert_current.content is defined else '' }}"
  register: site_cert_chain
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether the certificate must be issued
  ansible.builtin.set_fact:
    site_cert_issued: "{{ site_cert_expiry.rc != 0 or site_cert_chain.rc != 0 }}"

# Signed on the control node by the Substrate CA, never by OpenBao: the
# substrate's certificates do not depend on the secret store (ADR-0031 §4).
- name: Issue the certificate from the Substrate CA
  when: site_cert_issued | bool
  block:
    - name: Sign the certificate
      ansible.builtin.include_role:
        name: deevnet.builder.substrate_cert
      vars:
        substrate_cert_common_name: "{{ site_cert_common_name }}"
        substrate_cert_dns_names: "{{ [site_cert_common_name] + (site_cert_alt_names | reject('equalto', site_cert_common_name) | list) }}"
        substrate_cert_ips: "{{ site_cert_ips }}"
        substrate_cert_days: "{{ site_cert_days }}"

    - name: Assemble the full chain
      ansible.builtin.set_fact:
        site_cert_chain_pem: "{{ ([substrate_cert_result.chain]
          + ([lookup('file', site_cert_root_local)] if site_cert_chain_includes_root | bool else []))
          | map('trim') | join('\n') }}"
      no_log: true

    - name: Write the certificate and key
      ansible.builtin.copy:
        dest: "{{ site_cert_dir }}/{{ item.name }}"
        content: "{{ item.content }}\n"
        owner: "{{ item.owner }}"
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { name: "{{ site_cert_cert_file }}", content: "{{ site_cert_chain_pem }}", owner: root, mode: "0644" }
        - { name: "{{ site_cert_key_file }}", content: "{{ substrate_cert_result.private_key }}",
            owner: "{{ site_cert_key_owner }}", mode: "0400" }
      loop_control:
        label: "{{ item.name }}"
      become: true
      no_log: true
      notify: "{{ site_cert_notify }}"

# A directory a container mounts with :Z carries that container's private
# SELinux label, and podman applies it only when it CREATES the container. A
# file written here later gets the host's default label instead, and a
# container that is merely restarted cannot read it: at CHG-0031 the broker's
# new root file was var_t, its TLS listener reported running, and every
# handshake was reset. A file already labelled like its directory is left
# alone, and nothing is done where SELinux is off.
- name: Give the files their directory's SELinux label
  ansible.builtin.shell:
    cmd: |
      selinuxenabled 2>/dev/null || exit 0
      for f in {{ [site_cert_cert_file, site_cert_key_file, site_cert_ca_file] | map('quote') | join(' ') }}; do
        [ -e "$f" ] || continue
        d=$(dirname "$f")
        if [ "$(stat -c %C "$f")" != "$(stat -c %C "$d")" ]; then
          chcon --reference="$d" "$f" && echo "relabelled $f"
        fi
      done
    chdir: "{{ site_cert_dir }}"
  register: site_cert_relabel
  changed_when: site_cert_relabel.stdout | length > 0
  check_mode: false
  become: true
  notify: "{{ site_cert_notify }}"

# The CA's old names: site-ca.pem (before CHG-0031), and any root a re-root
# retired (site_root_ca_retired, CHG-0033).
- name: Remove the CA under its old names
  ansible.builtin.file:
    path: "{{ site_cert_dir }}/{{ item }}"
    state: absent
  loop: "{{ [site_cert_old_ca_file] + site_cert_retired_ca_files }}"
  when: item != site_cert_ca_file
  become: true
