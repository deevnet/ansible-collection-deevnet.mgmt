---
# The central log store in the observability store VM (ADR-0022, CHG-0018).
#
# VictoriaLogs stores; vmauth, in front, is the only thing another host can
# reach over HTTP. Both run with host networking - see defaults/main.yml for
# why that is a security property here.

# --- Refuse to start in a state that would be wrong ----------------------------

- name: Refuse to put the store on the OS disk
  ansible.builtin.assert:
    that: >-
      ansible_facts.mounts | selectattr('mount', 'equalto', '/srv') | list | length == 1
    fail_msg: >-
      /srv is not a mountpoint on {{ inventory_hostname }}. The store's data
      belongs on the data disk, not the OS disk (ADR-0022 §1). Declare
      mgmt_vm.data_disk for this host and run site.yml --tags vms first.
    quiet: true

- name: Refuse more than one operator partition until routing exists
  ansible.builtin.assert:
    that: victorialogs_vmauth_operator_partitions | length == 1
    fail_msg: >-
      Reading more than one partition with one token needs a routing rule
      between them, which the tenant-token change builds. Until then the
      operator token reads the substrate partition only.
    quiet: true

- name: Fail early if the operator read token is missing or short
  ansible.builtin.assert:
    that: victorialogs_vmauth_operator_read_token | length >= 32
    fail_msg: >-
      vault_victorialogs_operator_read_token must be in
      group_vars/observability_store/vault.yml and at least 32 characters.
      Generate it with `openssl rand -hex 32`, then vault, commit and push
      before running this.
    quiet: true
  no_log: true

# --- Directories and configuration ---------------------------------------------

# vmauth served TLS itself until CHG-0046. The service proxy holds the host's
# certificate now, and the old key is not left on the disk for nothing to read.
- name: Remove the log store's retired certificate and key
  ansible.builtin.file:
    path: "{{ victorialogs_retired_tls_dir }}"
    state: absent
  become: true

# Only the store's own data. The root and the configuration directory are
# created by writer.yml, which owns their ownership because the writer has to
# reach through them - two tasks setting the same path is how a role reports
# "changed" for ever and leaves the permissions to whichever ran last.
- name: Create the store's data directory
  ansible.builtin.file:
    path: "{{ victorialogs_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

# vmauth's users, and the program that writes them. auth.yml is RENDERED by
# that program from this role's base.json and the API's per-tenant files, so
# neither author can drop the other's users (ADR-0027, CHG-0020).
- name: Install the user writer and render the store's users
  ansible.builtin.import_tasks: writer.yml

# --- The two containers --------------------------------------------------------

- name: Run VictoriaLogs
  ansible.builtin.include_role:
    name: deevnet.mgmt.podman_service
  vars:
    podman_service_name: "{{ victorialogs_container_name }}"
    podman_service_description: "VictoriaLogs, the central log store (ADR-0022)"
    podman_service_image: "{{ victorialogs_image }}"
    podman_service_tarball: "{{ victorialogs_tarball }}"
    podman_service_network: host
    podman_service_volumes:
      - "{{ victorialogs_data_dir }}:/victoria-logs-data:Z"
    podman_service_command:
      - "-httpListenAddr={{ victorialogs_http_listen }}"
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod={{ victorialogs_retention_period }}"
      - "-retention.maxDiskUsagePercent={{ victorialogs_max_disk_usage_percent }}"
      # No -syslog.* flags: ADR-0027 removed the unauthenticated ingest path.
      # Deletion stays off (the default), which VictoriaLogs' own docs call
      # "good from security PoV - an attacker cannot remove the existing logs".
    podman_service_stop_timeout: 60
    # No podman_service_firewall_ports: VictoriaLogs listens on loopback only,
    # and nothing else on this host is opened to the zone.

- name: Run vmauth
  ansible.builtin.include_role:
    name: deevnet.mgmt.podman_service
  vars:
    podman_service_name: "{{ victorialogs_vmauth_container_name }}"
    podman_service_description: "vmauth, the authenticating proxy in front of the log store (ADR-0022 §3)"
    podman_service_image: "{{ victorialogs_vmauth_image }}"
    podman_service_tarball: "{{ victorialogs_vmauth_tarball }}"
    podman_service_network: host
    podman_service_volumes:
      # The DIRECTORY, not the file: the writer renames a new file into place
      # and a file mount would pin the container to the old inode. :z (shared),
      # not :Z, because the writer on the host must keep writing here.
      - "{{ victorialogs_auth_dir }}:/etc/vmauth:ro,z"
    # Two listeners, paired by position (vmauth docs, "Security"): the one the
    # service proxy forwards to, with no internal routes, and a second with
    # the internal routes. Both loopback, both plain HTTP.
    podman_service_command:
      - "-auth.config=/etc/vmauth/auth.yml"
      - "-configCheckInterval={{ victorialogs_vmauth_config_check_interval }}"
      - "-httpListenAddr={{ victorialogs_vmauth_listen_address }}:{{ victorialogs_vmauth_port }},"
      - "-httpInternalListenAddr=,{{ victorialogs_vmauth_internal_listen }}"
    podman_service_after:
      - "{{ victorialogs_container_name }}.service"
    # No podman_service_firewall_ports: vmauth listens on loopback only. The
    # service proxy opens what tenants reach.

# --- Remove ADR-0022's syslog rules ---------------------------------------------
# The listener is gone (ADR-0027, CHG-0019). A rich rule left behind would keep
# 6514 open on a host that no longer listens, so the role takes any of them away
# rather than only stopping to add them.

- name: Read the zone's rich rules
  ansible.builtin.command:
    argv: [firewall-cmd, --zone, "{{ victorialogs_firewalld_zone }}", --list-rich-rules]
  register: victorialogs_rich_rules
  changed_when: false
  failed_when: false
  become: true

- name: Remove every rich rule for the retired syslog port
  ansible.posix.firewalld:
    rich_rule: "{{ item }}"
    zone: "{{ victorialogs_firewalld_zone }}"
    permanent: true
    immediate: true
    state: disabled
  loop: >-
    {{ (victorialogs_rich_rules.stdout_lines | default([]))
       | select('search', 'port=\"' ~ victorialogs_retired_syslog_port ~ '\"') | list }}
  become: true

# CHG-0018 rendered auth.yml straight into the etc directory. CHG-0020 gave
# that file two authors - Ansible's base.json and the writer's users.d - and
# moved the rendered output to the auth directory, which is the one vmauth
# mounts. The old file was left behind on the host, holding a second copy of
# the operator's read token that nothing reads and nothing rotates.
#
# A credential nobody reads is still a credential. Removed here rather than by
# hand, so a store rebuilt from an older state does not quietly keep one.
- name: Remove the pre-CHG-0020 rendered auth file
  ansible.builtin.file:
    path: "{{ victorialogs_etc_dir }}/auth.yml"
    state: absent
  become: true

- name: Restart now if the users changed
  ansible.builtin.meta: flush_handlers

# --- Readiness -------------------------------------------------------------------

- name: Wait for VictoriaLogs to report healthy
  ansible.builtin.uri:
    url: "http://{{ victorialogs_http_listen }}/health"
  register: victorialogs_health
  retries: 30
  delay: 2
  until: victorialogs_health.status == 200
  become: true

- name: Wait for vmauth to report healthy on its internal listener
  ansible.builtin.uri:
    url: "http://{{ victorialogs_vmauth_internal_listen }}/health"
  register: victorialogs_vmauth_health
  retries: 30
  delay: 2
  until: victorialogs_vmauth_health.status == 200
  become: true

# The second render, now that vmauth is running: same inputs, same output, and
# this one reloads. A configuration written but not reloaded is a user the
# store does not honour yet, which is the ambiguity the API must never be left
# with.
- name: Render the store's users again, and reload
  ansible.builtin.command:
    argv: [sudo, -u, "{{ victorialogs_writer_user }}", "{{ victorialogs_writer_path }}", --render]
  changed_when: false
  become: true

# A token-less request must be REFUSED. This is a self-check from the host, on
# the listener the service proxy forwards to; it is not a substitute for
# CHG-0018's tests from other segments.
- name: Confirm vmauth refuses a request with no token
  ansible.builtin.uri:
    url: "{{ victorialogs_vmauth_local_url }}/select/logsql/query?query=*"
    status_code: [401]
  become: true

- name: Report what the store is serving
  ansible.builtin.debug:
    msg:
      - "vmauth: {{ victorialogs_vmauth_local_url }}, served over HTTPS by the service proxy (1 operator read user; tenants' users arrive with tenant tokens)"
      - "VictoriaLogs: {{ victorialogs_http_listen }} (loopback only), retention {{ victorialogs_retention_period }}, disk cap {{ victorialogs_max_disk_usage_percent }}%"
