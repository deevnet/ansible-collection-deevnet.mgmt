---
# The log store's TLS certificate from the site CA (ADR-0030), through site_cert.
# vmauth serves it on the TLS listener; the log store behind it is loopback only.
#
# site_cert talks to OpenBao from the CONTROL NODE, against the pinned listener
# certificate, as Ansible's own AppRole - this VM has no path to OpenBao and
# must not need one.
- name: Issue The log store's certificate
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ victorialogs_tls_dir }}"
    site_cert_key_owner: root
    site_cert_common_name: "{{ victorialogs_tls_common_name }}"
    site_cert_alt_names: "{{ victorialogs_tls_alt_names }}"
    site_cert_ips: "{{ [victorialogs_tls_ip] }}"
    site_cert_ttl: "{{ victorialogs_tls_ttl }}"
    site_cert_renew_before: "{{ victorialogs_tls_renew_before }}"
    site_cert_notify: restart log store
    site_cert_openbao_addr: "{{ victorialogs_openbao_addr }}"
    site_cert_openbao_ca_local: "{{ victorialogs_openbao_ca_local }}"
    site_cert_openbao_role_id: "{{ victorialogs_openbao_ansible_role_id }}"
    site_cert_openbao_secret_id: "{{ victorialogs_openbao_ansible_secret_id }}"
    site_cert_pki_mount: "{{ victorialogs_openbao_pki_mount }}"
    site_cert_pki_role: "{{ victorialogs_openbao_pki_role }}"
