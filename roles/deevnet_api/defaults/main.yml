---
# Deevnet API (ADR-0012) and its database, in the provisioning VM (ADR-0013 §1).
#
# Provisioning-only: nothing at runtime depends on it being up. The database is
# hosted tenant state, not the source of truth (ADR-0012), so it has no
# published port - only the API reaches it, over a private podman network.

# Built and staged by the deevnet-provisioning-api repository's `make stage`. Bump the
# version here when a new one is staged.
deevnet_api_version: "v0.2.0"
deevnet_api_image: "localhost/deevnet-api:{{ deevnet_api_version }}"
deevnet_api_tarball: "deevnet-api/deevnet-api-{{ deevnet_api_version }}.tar"
deevnet_api_container_name: deevnet-api

deevnet_api_listen_address: "0.0.0.0"
deevnet_api_port: 8080
# TLS whenever tenants are served; the certificate names 127.0.0.1 too, so the
# role's own checks verify it.
deevnet_api_local_url: "{{ 'https' if deevnet_api_site | length > 0 else 'http' }}://127.0.0.1:{{ deevnet_api_port }}"

# The shared bearer token of the API shell. Per-tenant credentials replace it
# (ADR-0012 §9). Generate with: openssl rand -hex 32
deevnet_api_token: "{{ vault_deevnet_api_token | default('') }}"

deevnet_api_network: deevnet-api

deevnet_api_db_container_name: deevnet-api-db
deevnet_api_db_image_name: "docker.io/library/postgres"
deevnet_api_db_image_tag: "17.11"
deevnet_api_db_tarball: "postgres/postgres-{{ deevnet_api_db_image_tag }}.tar"
deevnet_api_db_name: deevnet_api
deevnet_api_db_user: deevnet_api
# Applied only when the data directory is first initialised. Changing it later
# needs an ALTER ROLE inside the database as well as a vault edit.
# Generate with: openssl rand -hex 24
deevnet_api_db_password: "{{ vault_deevnet_api_db_password | default('') }}"

deevnet_api_data_root: /srv/deevnet-api
deevnet_api_db_data_dir: "{{ deevnet_api_data_root }}/pgdata"

# --- Tenants (ADR-0015) -------------------------------------------------------
#
# The API serves tenants when deevnet_api_site is set, and then refuses to start
# unless every value below is too. Leave it empty and the tenant routes answer
# 501, as the shell did. Site values come from inventory. Credentials reach the
# API through OpenBao (ADR-0016): this role writes them into its KV secret, and
# the container holds only the API's AppRole.
deevnet_api_site: ""
deevnet_api_site_octet: "{{ deevnet_site_octet | default('') }}"
deevnet_api_root_domain: "{{ deevnet_root_domain | default('') }}"
deevnet_api_vrf_vni_base: ""
deevnet_api_vnet_vni_base: ""
deevnet_api_fabric_controller: "{{ (deevnet_tenant_fabric | default({})).controller_id | default('') }}"
deevnet_api_fabric_node: "{{ (deevnet_tenant_fabric | default({})).node | default('') }}"
deevnet_api_dns_update_server: ""
deevnet_api_dns_apex_ns: ""
deevnet_api_dns_update_from: []
deevnet_api_state_endpoint: ""
deevnet_api_state_bucket: tf-state
deevnet_api_resolver_forward_to: ""
deevnet_api_powerdns_url: ""
deevnet_api_opnsense_url: ""
deevnet_api_minio_endpoint: ""
deevnet_api_proxmox_url: ""
deevnet_api_enrollment_ttl: 72h

# The exit node's egress agent (ADR-0015 §7). It reads GET /v1/fabric/egress
# and nothing else, so the hypervisor holds no operator credential. Optional:
# empty leaves that route operator-only. The same value goes to the agent, from
# group_vars/all so both hosts see it.
deevnet_api_agent_token: "{{ vault_deevnet_egress_agent_token | default('') }}"

# OpenBao (ADR-0016). The address the API and this role use, and the listener
# certificate the openbao role fetched to the control node.
deevnet_api_openbao_addr: ""
deevnet_api_openbao_ca_local: ""
# Ansible's AppRole, from the vault, which writes the KV secret and issues the
# API's certificate.
deevnet_api_openbao_ansible_role_id: "{{ vault_openbao_ansible_role_id | default('') }}"
deevnet_api_openbao_ansible_secret_id: "{{ vault_openbao_ansible_secret_id | default('') }}"
deevnet_api_openbao_kv_mount: deevnet-api
deevnet_api_openbao_kv_path: backends
deevnet_api_openbao_approle: deevnet-api
deevnet_api_openbao_pki_mount: pki
deevnet_api_openbao_pki_role: platform

# The KV secret's fields, as the API reads them. Set in inventory from the vault;
# every value must be non-empty. token_hmac_key is base64 of at least 32 bytes.
deevnet_api_backends: {}

# TLS from the site CA. Reissued when missing or within renew_before of expiry.
deevnet_api_tls_dir: "{{ deevnet_api_data_root }}/tls"
deevnet_api_tls_common_name: "api.{{ deevnet_substrate | default('') }}.{{ deevnet_root_domain | default('') }}"
deevnet_api_tls_ip: "{{ env.interfaces.eth0.ip | default('') }}"
deevnet_api_tls_ttl: 2160h
deevnet_api_tls_renew_before: 2592000
# The distroless image runs as nonroot, uid 65532; it reads its key file.
deevnet_api_container_uid: 65532
