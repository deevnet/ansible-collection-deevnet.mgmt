---
# Omada controller - the site's network device controller (ADR-0009), run as a
# container in the network management VM (ADR-0013 §7).
#
# Ported from deevnet.builder's omada_controller role, which stays behind as a
# cold fallback. The differences are the VM's: no base/artifacts dependencies,
# the image is pushed rather than fetched from 127.0.0.1, and the container's
# hostname is the VM's.

omada_image_name: "docker.io/mbentley/omada-controller"
omada_image_tag: "6.3.0.45"
# Pushed from the control node's image store by podman_service.
omada_tarball: "omada-controller/omada-controller-{{ omada_image_tag }}.tar"

omada_container_name: "omada-controller"

omada_data_root: "/opt/omada-controller"

# Same shape as the builder role, and the inventory's network_controllers vars:
# a list of KEY=VALUE strings.
omada_env_vars:
  - "TZ=America/New_York"
  - "MANAGE_HTTP_PORT=8088"
  - "MANAGE_HTTPS_PORT=8043"
  - "PORTAL_HTTP_PORT=8088"
  - "PORTAL_HTTPS_PORT=8843"
  - "SHOW_SERVER_LOGS=true"
  - "SHOW_MONGODB_LOGS=false"

omada_https_port: 8043

# Host networking, so firewalld is the only gate - keep these lists complete.
#
# Source: Omada, "Which Ports do Omada SDN Controller and Omada Discovery
# Utility Use (above Controller 5.0.15)", updated 08-28-2026,
# https://support.omadanetworks.com/us/document/13090/ - checked against the
# ports 6.3.0.45 actually binds (its omada.properties) in CHG-0008 Step 8.
omada_firewall_ports_tcp:
  - 8088    # management page, HTTP
  - 8043    # management page, HTTPS
  - 8843    # clients' portal page, HTTPS
  - 29811   # manage devices on v4-adapted firmware
  - 29812   # manage devices on v4-adapted firmware
  - 29813   # firmware upgrade for devices on v4-adapted firmware
  - 29814   # manage devices on v5-adapted firmware
  - 29815   # from v5.9: receives device info and packet capture files
  - 29816   # from v5.9: remote control terminal session
  - 29817   # communication between devices and the controller
omada_firewall_ports_udp:
  - 29810   # device discovery - a broadcast
  - 27001   # discovery by the Omada app on the same network
# Deliberately not opened:
#   8044/tcp   bound by 6.3.0.45 (omada.properties: upgrade.es.https.port) but not
#              in Omada's port reference; open it only once a documented use
#              needs it.
#   19810/udp  OLT discovery; this site has no OLT.
#   27217/tcp  the controller's MongoDB, bound to 127.0.0.1 only.

# Opened by earlier versions of this list and absent from the port reference.
# Closed on every run, so a host configured from the old list converges.
omada_firewall_ports_retired:
  - 29814/udp   # the reference lists 29814 as TCP only
  - 27002/tcp   # not in the reference, and 6.3.0.45 does not bind it

# First start initialises MongoDB and takes minutes, not seconds.
omada_start_timeout: 600
