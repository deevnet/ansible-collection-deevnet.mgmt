---
# Grafana's TLS certificate from the Substrate CA (ADR-0031 §4), through site_cert.
# Its own certificate rather than a copy of vmauth's: the two containers run as
# different users, and a key readable by both would be a key readable by
# either one's compromise. Grafana has no plaintext listener, so without a
# certificate this host serves no dashboards.
#
# site_cert signs it on the CONTROL NODE: this VM needs no path to anything.
- name: Issue Grafana's certificate
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ grafana_tls_dir }}"
    site_cert_key_owner: "{{ grafana_uid }}"
    site_cert_common_name: "{{ grafana_tls_common_name }}"
    site_cert_alt_names: "{{ grafana_tls_alt_names }}"
    site_cert_ips: "{{ [grafana_tls_ip] }}"
    site_cert_renew_before: "{{ grafana_tls_renew_before }}"
    site_cert_notify: restart grafana
