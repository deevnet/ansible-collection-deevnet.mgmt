---
# One of the issuing CAs OpenBao holds: the Tenant Device CA (ADR-0031 §3) or
# the Tenant Service CA (ADR-0037). Run once for each, with `openbao_ca` set to
# its entry in openbao_issuing_cas.
#
# Its key is the vault's, never OpenBao's own (ADR-0042 §4, CHG-0036): made on
# the control node by playbooks/tenant-cas.yml, signed by the Site CA in the
# Issuing CA ceremony, and imported here with its certificate on every build.
# A rebuilt OpenBao comes back with the same CA. Two states, each a run of
# this role:
#
#   1. The mount's default issuer is not the inventory's certificate: check
#      the vault's key is that certificate's, import both with the Site CA,
#      and make that issuer the default.
#   2. The mount's default issuer is the inventory's certificate and chains to
#      the Deevnet Root CA: nothing to do.
#
# An issuer imported or generated before stays in the mount, not the
# default; what it issued still verifies by its chain. To rotate: run
# tenant-cas.yml for a new key and request, take it to the ceremony, and put
# the new key and certificate in place of the old.

- name: "Read the {{ openbao_ca.name }}"
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/{{ openbao_ca.mount }}/ca/pem"
    ca_path: "{{ openbao_tls_ca }}"
    status_code: [200, 204]
    return_content: true
  register: openbao_ica

- name: "Check the {{ openbao_ca.name }} chains to the Deevnet Root CA"
  ansible.builtin.shell:
    cmd: >-
      f=$(mktemp) && cat > "$f" &&
      openssl verify -no-CApath -no-CAstore -CAfile {{ openbao_root_ca_local | quote }}
      -untrusted {{ openbao_site_ca_local | quote }} "$f"; rc=$?; rm -f "$f"; exit $rc
    stdin: "{{ openbao_ica.content }}"
  register: openbao_ica_chain
  when: openbao_ica.status == 200
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false

# Ready means the mount serves the certificate the inventory holds. Chaining
# to the root is not enough by itself: after a rotation the old CA still
# chains, and the new certificate would never be installed.
- name: "Decide what the {{ openbao_ca.name }} needs"
  ansible.builtin.set_fact:
    openbao_ica_ready: >-
      {{ openbao_ica.status == 200 and openbao_ica_chain.rc == 0
         and (openbao_ca.cert_local is file)
         and ((openbao_ica.content | trim) == (lookup('file', openbao_ca.cert_local) | trim)) }}

# State 1.
- name: "Import the {{ openbao_ca.name }} from the vault"
  when: not openbao_ica_ready | bool
  block:
    - name: Refuse without the key in the vault and the certificate in the inventory
      ansible.builtin.assert:
        that:
          - openbao_ca.key | length > 0
          - openbao_ca.cert_local is file
        fail_msg: >-
          The {{ openbao_ca.name }} needs its key in the vault ({{ openbao_ca.key_var }}, from
          playbooks/tenant-cas.yml) and its certificate at {{ openbao_ca.cert_local }}, from the
          Issuing CA ceremony. OpenBao no longer makes a CA key of its own.
        quiet: true

    - name: Check the certificate chains to the Deevnet Root CA through the Site CA
      ansible.builtin.command:
        argv: [openssl, verify, -no-CApath, -no-CAstore, -CAfile, "{{ openbao_root_ca_local }}", -untrusted,
               "{{ openbao_site_ca_local }}", "{{ openbao_ca.cert_local }}"]
      delegate_to: localhost
      become: false
      changed_when: false

    # A key and a certificate that are not a pair would import as two
    # strangers: an issuer that cannot sign, and a key no issuer uses.
    - name: Check the vault's key is the certificate's
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          k=$(openssl pkey -pubout -outform DER | sha256sum);
          c=$(openssl x509 -in {{ openbao_ca.cert_local | quote }} -noout -pubkey | openssl pkey -pubin -outform DER | sha256sum);
          [ "$k" = "$c" ]
        stdin: "{{ openbao_ca.key }}"
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
      register: openbao_ica_pair
      failed_when: false

    - name: Stop if they are not a pair
      ansible.builtin.assert:
        that: openbao_ica_pair.rc == 0
        fail_msg: >-
          The key in {{ openbao_ca.key_var }} is not the key of {{ openbao_ca.cert_local }}.
          Nothing was imported.
        quiet: true

    # The Site CA comes in beside it as an issuer with no key, so the mount
    # serves the chain. A second import of the same bundle changes nothing.
    - name: Import the key, the certificate and the Site CA
      ansible.builtin.uri:
        url: "{{ openbao_local_url }}/v1/{{ openbao_ca.mount }}/issuers/import/bundle"
        method: POST
        ca_path: "{{ openbao_tls_ca }}"
        headers: {X-Vault-Token: "{{ openbao_token }}"}
        body_format: json
        body:
          pem_bundle: "{{ [openbao_ca.key | trim, lookup('file', openbao_ca.cert_local) | trim, lookup('file', openbao_site_ca_local) | trim] | join('\n') }}"
      register: openbao_ica_import
      changed_when: (openbao_ica_import.json.data.imported_issuers | default([], true) | length) > 0
      no_log: true

    - name: Read the issuers the import names
      ansible.builtin.uri:
        url: "{{ openbao_local_url }}/v1/{{ openbao_ca.mount }}/issuer/{{ item }}"
        ca_path: "{{ openbao_tls_ca }}"
        headers: {X-Vault-Token: "{{ openbao_token }}"}
      loop: "{{ openbao_ica_import.json.data.mapping | dict2items | selectattr('value') | map(attribute='key') | list }}"
      register: openbao_ica_issuers

    - name: Pick the issuer that is the certificate, with its key
      ansible.builtin.set_fact:
        openbao_ica_issuer: >-
          {{ openbao_ica_issuers.results
             | selectattr('json.data.key_id', 'truthy')
             | selectattr('json.data.certificate', 'match', '^' ~ (lookup('file', openbao_ca.cert_local) | trim | regex_escape))
             | map(attribute='item') | list | first | default('') }}

    - name: Stop if no issuer is the certificate
      ansible.builtin.assert:
        that: openbao_ica_issuer | length > 0
        fail_msg: The import named no issuer that is {{ openbao_ca.cert_local }} with its key.
        quiet: true

    - name: Make it the default issuer
      ansible.builtin.uri:
        url: "{{ openbao_local_url }}/v1/{{ openbao_ca.mount }}/config/issuers"
        method: POST
        ca_path: "{{ openbao_tls_ca }}"
        headers: {X-Vault-Token: "{{ openbao_token }}"}
        body_format: json
        body:
          default: "{{ openbao_ica_issuer }}"
      changed_when: true

    - name: "Read the {{ openbao_ca.name }} again"
      ansible.builtin.uri:
        url: "{{ openbao_local_url }}/v1/{{ openbao_ca.mount }}/ca/pem"
        ca_path: "{{ openbao_tls_ca }}"
        return_content: true
      register: openbao_ica_after

    - name: "Check OpenBao's {{ openbao_ca.name }} is the ceremony's certificate"
      ansible.builtin.assert:
        that: (openbao_ica_after.content | trim) == (lookup('file', openbao_ca.cert_local) | trim)
        fail_msg: The mount's CA is not the certificate in {{ openbao_ca.cert_local }}.
        quiet: true
