---
# The listener's certificate, from the site's Substrate CA like every other
# substrate certificate (ADR-0031 §4): signed on the control node, so OpenBao
# answers TLS before it has any PKI of its own, and a rebuilt OpenBao comes up
# with no cycle. The file is the chain (leaf, Substrate CA, Site CA); clients,
# and this role, trust the Deevnet Root CA installed beside it.

- name: Issue the listener certificate from the Substrate CA
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ openbao_tls_dir }}"
    site_cert_cert_file: listener.pem
    site_cert_key_file: listener-key.pem
    site_cert_key_owner: "{{ openbao_uid }}"
    site_cert_common_name: "{{ openbao_fqdn }}"
    site_cert_alt_names: ["{{ openbao_alias_fqdn }}"]
    site_cert_ips: ["{{ openbao_address }}", 127.0.0.1]
    site_cert_notify: restart openbao
