---
# Build-time secrets (CHG-0026). The image factory's Packer builds and the
# tenant fabric's Terraform read each hypervisor's Proxmox API token from here,
# per run, as the image-factory AppRole - never from a file on disk.
#
# The inventory is authoritative: a rotated token is changed in the vault and
# this role writes it here. Written only when it differs, because every KV v2
# write is a new version.

- name: Issue the image-factory AppRole's credentials, once
  when: >-
    openbao_image_factory_role_id | length == 0
    or openbao_image_factory_secret_id | length == 0
  block:
    - name: Read the image-factory role ID
      ansible.builtin.uri:
        url: "{{ openbao_local_url }}/v1/auth/approle/role/image-factory/role-id"
        ca_path: "{{ openbao_tls_dir }}/listener.pem"
        headers: {X-Vault-Token: "{{ openbao_token }}"}
      register: openbao_if_role

    - name: Issue the image-factory secret ID
      ansible.builtin.uri:
        url: "{{ openbao_local_url }}/v1/auth/approle/role/image-factory/secret-id"
        method: POST
        ca_path: "{{ openbao_tls_dir }}/listener.pem"
        headers: {X-Vault-Token: "{{ openbao_token }}"}
      register: openbao_if_secret
      no_log: true

    # The same hand-off as Ansible's own AppRole at init: a 0600 file on the
    # control node, to be moved into the vault, committed, PUSHED, and only
    # then deleted (vault-operations: "Secrets a change produces").
    - name: Write them for the vault
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        dest: "{{ openbao_init_output_dir }}/image-factory-approle.json"
        content: >-
          {{ {'vault_openbao_image_factory_role_id': openbao_if_role.json.data.role_id,
              'vault_openbao_image_factory_secret_id': openbao_if_secret.json.data.secret_id,
              'note': 'Move both into group_vars/all/vault.yml, make vault, commit, PUSH, then delete this file.'}
             | to_nice_json }}
        mode: "0600"
      no_log: true

    - name: Say where they are
      ansible.builtin.debug:
        msg: >-
          The image-factory AppRole's credentials are in
          {{ openbao_init_output_dir }}/image-factory-approle.json. Move them into the
          vault (group_vars/all/vault.yml), commit and push, then delete the file.

- name: Read the Proxmox tokens as OpenBao holds them
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/{{ openbao_build_kv_mount }}/data/proxmox/{{ hostvars[item].proxmox_node | default(item) }}"
    ca_path: "{{ openbao_tls_dir }}/listener.pem"
    headers: {X-Vault-Token: "{{ openbao_token }}"}
    status_code: [200, 404]
  loop: "{{ openbao_build_hypervisors }}"
  when: (hostvars[item].proxmox_token_secret | default('')) | length > 0
  register: openbao_build_current
  no_log: true

- name: Write the Proxmox tokens that differ
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/{{ openbao_build_kv_mount }}/data/proxmox/{{ hostvars[item.item].proxmox_node | default(item.item) }}"
    method: POST
    ca_path: "{{ openbao_tls_dir }}/listener.pem"
    headers: {X-Vault-Token: "{{ openbao_token }}"}
    body_format: json
    body: {data: "{{ openbao_build_want }}"}
    status_code: [200, 204]
  vars:
    openbao_build_want:
      url: "https://{{ hostvars[item.item].ansible_host | default(item.item) }}:8006/api2/json"
      node: "{{ hostvars[item.item].proxmox_node | default(item.item) }}"
      token_id: "{{ hostvars[item.item].proxmox_token_id }}"
      token_secret: "{{ hostvars[item.item].proxmox_token_secret }}"
  loop: "{{ openbao_build_current.results | selectattr('skipped', 'undefined') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: >-
    item.status == 404
    or item.json.data.data != openbao_build_want
  changed_when: true
  no_log: true
