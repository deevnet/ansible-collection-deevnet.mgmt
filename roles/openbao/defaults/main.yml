---
# OpenBao - the substrate's runtime secrets (ADR-0016), in the identity VM.
#
# What it holds now: the Deevnet API's backend credentials (KV), the key that
# encrypts tenant secrets in the API's database (Transit), the tenant CAs
# (PKI), and single-use enrollment tokens (response wrapping). ansible-vault
# stays the root of trust: the seal key, the credential Ansible configures it
# with, and every key OpenBao uses, which it imports (ADR-0042 §4).

openbao_image_name: "quay.io/openbao/openbao"
openbao_image_tag: "2.6.2"
openbao_tarball: "openbao/openbao-{{ openbao_image_tag }}.tar"
openbao_container_name: openbao

openbao_data_root: /srv/openbao
openbao_config_dir: "{{ openbao_data_root }}/config"
openbao_storage_dir: "{{ openbao_data_root }}/data"
openbao_secrets_dir: "{{ openbao_data_root }}/secrets"
openbao_tls_dir: "{{ openbao_data_root }}/tls"
# The file audit device (CHG-0036): every request, with secrets HMAC'd, on the
# identity VM's disk. OpenBao refuses requests it cannot audit, so the file is
# rotated and the role stops when the disk under it runs short.
openbao_logs_dir: "{{ openbao_data_root }}/logs"
openbao_audit_rotate_size: 50M
openbao_audit_rotate_keep: 10
openbao_audit_min_free_mb: 1024

# The image runs as `openbao` (uid 100, gid 1000). Its entrypoint would chown
# its volumes, which fails unless it runs as root; the directories are owned to
# match instead, and the entrypoint is bypassed.
openbao_uid: 100
openbao_gid: 1000

openbao_port: 8200
openbao_cluster_port: 8201
openbao_listen_address: "0.0.0.0"
# What clients call it by. The listener certificate names both, and the IP.
openbao_fqdn: "{{ inventory_hostname }}.{{ deevnet_substrate }}.{{ deevnet_root_domain }}"
openbao_alias_fqdn: "bao.{{ deevnet_substrate }}.{{ deevnet_root_domain }}"
openbao_address: "{{ env.interfaces.eth0.ip }}"
openbao_api_url: "https://{{ openbao_address }}:{{ openbao_port }}"
# What this role calls, on the VM itself. The listener certificate names
# 127.0.0.1, so it is verified against the certificate rather than skipped.
openbao_local_url: "https://127.0.0.1:{{ openbao_port }}"

# ADR-0016 §2: a 32-byte key, base64, from the vault. OpenBao unseals itself
# with it on every start. Generate with: head -c 32 /dev/urandom | base64
# Rotating it: add the old one as openbao_seal_previous_key with its id.
openbao_seal_key: "{{ vault_openbao_seal_key | default('') }}"
openbao_seal_key_id: "{{ vault_openbao_seal_key_id | default('seal-1') }}"

# The listener's certificate comes from the Substrate CA (tasks/tls.yml), and
# clients trust the Deevnet Root CA beside it. The pin fetched to the control
# node for OpenBao's clients is that root, at its historical path.
openbao_tls_ca: "{{ openbao_tls_dir }}/{{ site_root_ca_name }}"
openbao_ca_local_path: "{{ playbook_dir }}/../.openbao/{{ inventory_hostname }}-listener.pem"

# First initialisation writes the recovery key, the root token and Ansible's
# AppRole credentials here, on the control node, root-readable only. Move them
# into the vault and delete the file; the root token is revoked before the run
# ends (ADR-0016 §2).
openbao_init_output_dir: "{{ playbook_dir }}/../.openbao"

# After initialisation, Ansible works through its own AppRole.
openbao_ansible_role_id: "{{ vault_openbao_ansible_role_id | default('') }}"
openbao_ansible_secret_id: "{{ vault_openbao_ansible_secret_id | default('') }}"
# The image-factory AppRole's credentials, which scripts/pve-creds uses. Only
# checked here: empty means they have not been issued yet (build_secrets.yml).
openbao_image_factory_role_id: "{{ vault_openbao_image_factory_role_id | default('') }}"
openbao_image_factory_secret_id: "{{ vault_openbao_image_factory_secret_id | default('') }}"

# ADR-0016 §3
openbao_kv_mount: deevnet-api
# Build-time secrets (CHG-0026): what the image factory's Packer builds and the
# tenant fabric's Terraform need, read per run by scripts/pve-creds and never
# rendered to a file. The inventory stays authoritative; this is the copy the
# builds read, so every read is audited and the token that reads it lives
# minutes.
openbao_build_kv_mount: image-factory
# The hypervisors whose Proxmox API token is written to
# image-factory/proxmox/<node>. Each needs proxmox_token_id/_secret.
openbao_build_hypervisors: "{{ groups['hypervisors'] | default([]) }}"
# The Transit key that seals tenant secrets in the API's database. Its
# material is the vault's (vault_openbao_transit_key, made by
# playbooks/transit-key.yml), imported on every build, so a rebuilt OpenBao
# reads what the old one sealed (ADR-0042 §4, CHG-0036). The name is set in
# the inventory, where the deevnet_api role reads it too.
openbao_transit_key: tenant-secrets-v2
openbao_transit_key_material: "{{ vault_openbao_transit_key | default('') }}"
# The key being replaced, while the API reseals stored values: the API may
# decrypt with it and nothing else. Empty once the reseal is done.
openbao_transit_key_previous: ""
# The site's Tenant Device CA (ADR-0031 §3). Its key is the vault's, made on
# the control node (playbooks/tenant-cas.yml), and imported with the
# certificate the ceremony signed (ADR-0042 §4). Its name carries no site: it
# serves tenants at every site (ADR-0039 §2).
# It issues tenant devices' client certificates only (CHG-0034). No substrate
# certificate comes from OpenBao, from this CA or the next.
openbao_tenant_device_mount: pki-tenant-device
# The mount's ceiling, not a certificate's lifetime.
openbao_tenant_device_mount_ttl: 87600h
openbao_tenant_device_organization: Deevnet
openbao_tenant_device_ou: "{{ deevnet_substrate | capitalize }} Site"
openbao_tenant_device_common_name: Deevnet Tenant Device CA
openbao_tenant_device_key: "{{ vault_tenant_device_ca_key | default('') }}"
# From the ceremony, in the inventory beside the Site CA.
openbao_tenant_device_cert_local: "{{ site_tenant_device_ca_file | default(site_ca_file | dirname ~ '/deevnet-' ~ deevnet_substrate ~ '-tenant-device-ca.pem') }}"
openbao_site_ca_local: "{{ site_ca_file }}"
openbao_root_ca_local: "{{ site_root_ca_file }}"
# The site's Tenant Service CA (ADR-0037): a second issuing CA, its key the
# vault's like the Tenant Device CA's, on a mount of its own. It issues server
# certificates for names in a tenant's own zone, through the Deevnet API. It
# shares nothing with the Tenant Device CA: not a mount, a key or a role.
openbao_tenant_service_mount: pki-tenant-service
openbao_tenant_service_mount_ttl: 87600h
openbao_tenant_service_organization: Deevnet
openbao_tenant_service_ou: "{{ deevnet_substrate | capitalize }} Site"
openbao_tenant_service_common_name: Deevnet Tenant Service CA
openbao_tenant_service_key: "{{ vault_tenant_service_ca_key | default('') }}"
openbao_tenant_service_cert_local: "{{ site_tenant_service_ca_file | default(site_ca_file | dirname ~ '/deevnet-' ~ deevnet_substrate ~ '-tenant-service-ca.pem') }}"

# The issuing CAs OpenBao holds, each run through tasks/issuing_ca.yml. `slug`
# is the name the ceremony's tools know it by (--ca), and the name
# playbooks/issuing-ca.yml takes to run one on its own.
openbao_issuing_cas:
  - name: Tenant Device CA
    slug: tenant-device
    mount: "{{ openbao_tenant_device_mount }}"
    mount_ttl: "{{ openbao_tenant_device_mount_ttl }}"
    organization: "{{ openbao_tenant_device_organization }}"
    ou: "{{ openbao_tenant_device_ou }}"
    common_name: "{{ openbao_tenant_device_common_name }}"
    key: "{{ openbao_tenant_device_key }}"
    key_var: vault_tenant_device_ca_key
    cert_local: "{{ openbao_tenant_device_cert_local }}"
  - name: Tenant Service CA
    slug: tenant-service
    mount: "{{ openbao_tenant_service_mount }}"
    mount_ttl: "{{ openbao_tenant_service_mount_ttl }}"
    organization: "{{ openbao_tenant_service_organization }}"
    ou: "{{ openbao_tenant_service_ou }}"
    common_name: "{{ openbao_tenant_service_common_name }}"
    key: "{{ openbao_tenant_service_key }}"
    key_var: vault_tenant_service_ca_key
    cert_local: "{{ openbao_tenant_service_cert_local }}"

# The one role the Tenant Service CA signs through (ADR-0037 §3-§4,
# Certificates standard §2-§4), a CEL role since CHG-0059. The Deevnet API may
# sign on it and may not change it. Every rule in it is one the API also
# applies; this is the second line, held by the secret store.
openbao_tenant_service_role: tenant-service
# The site's zone. A tenant's names here are <label>.<tenant>.<this>; the
# substrate's own are <name>.<this>.
openbao_tenant_service_site_zone: "{{ deevnet_substrate }}.{{ deevnet_root_domain }}"

# The Tenant Service CA's CEL role (CHG-0059, ADR-0040 §3), the one the API
# signs through once OPENBAO_TENANT_SERVICE_CEL is on. A CEL role is a program,
# not a list of permissions: the certificate is the template it returns, and
# it refuses a request by returning a string. So it says everything the
# classic role it replaced said (allowed_domains "*.*.<root>", server use, no
# IP or other names, a year), and what that role could not: a tenant label
# that is reserved, and a request that names two tenants.
#
# What it does not see is the issuer, so unlike the classic role it does not
# stop a leaf at the CA's own expiry. A leaf lasts a year and the Tenant
# Service CA until 2031; the CA is renewed long before that matters.
#
# The sites a certificate may name beside its site-less names, the same list
# the API is given (deevnet_api_certificate_sites).
openbao_tenant_service_sites: "{{ site_tenant_certificate_sites | default([deevnet_substrate]) }}"
# Labels no tenant may take: the Deevnet API's reservedNames
# (internal/tenant/site.go), copied so that the secret store refuses them on
# its own. A label added there is added here.
openbao_tenant_reserved_labels: [home, mobile, mgmt, dvnt, dvntm, device, mqtt, artifacts]
# <service>.<tenant>.[<site>.]<root>: a service label as the API allows it
# (1-20 of a-z, 0-9 and dashes, starting with a letter, not ending with a
# dash), a tenant name (1-8 of a-z and 0-9, starting with a letter), and one of
# the sites or none. Backslashes are doubled for the CEL string literal.
openbao_tenant_service_name_regex: >-
  ^[a-z]([a-z0-9-]{0,18}[a-z0-9])?\\.[a-z][a-z0-9]{0,7}\\.(({{ openbao_tenant_service_sites | join('|') }})\\.)?{{ deevnet_root_domain | replace('.', '\\.') }}$
openbao_tenant_service_cel_program:
  variables:
    # The API sends the first name as common_name and the rest as alt_names.
    - name: names
      expression: >-
        [string(request.common_name)] + (has(request.alt_names) && string(request.alt_names) != ''
        ? string(request.alt_names).split(',').map(n, n.trim()) : [])
    - name: tenant
      expression: "names[0].split('.')[1]"
    - name: shaped
      expression: "names.all(n, n.matches('{{ openbao_tenant_service_name_regex }}'))"
    - name: one_tenant
      expression: "names.all(n, n.split('.')[1] == tenant)"
    - name: reserved
      expression: "tenant in {{ openbao_tenant_reserved_labels | to_json }}"
    # device.<tenant>.<root> holds the tenant's device names (ADR-0039 §4).
    - name: device_label
      expression: "names.exists(n, n.split('.')[0] == 'device')"
    - name: unique
      expression: "names.all(n, names.filter(m, m == n).size() == 1)"
    # An address, a URI or another kind of name is refused, not dropped, as
    # the classic role refused it. The API never asks for one.
    - name: extras
      expression: "['ip_sans', 'uri_sans', 'other_sans'].exists(k, k in request && string(request[k]) != '')"
    # Sizes and curves are the API's to check; Ed25519 and the rest are refused.
    - name: key_ok
      expression: "use_csr && parsed_csr.PublicKeyAlgorithm in ['RSA', 'ECDSA']"
    # The certificate the classic role gave: names from the request and nothing from
    # the CSR but its key, a year, server use only. KeyUsage is copied into
    # Go's bitmask as a number, so 5 is digital signature (1) and key
    # encipherment (4), whatever the enum's names say (OpenBao 2.6.2).
    - name: cert
      expression: >-
        CertTemplate{
        Subject: PKIX.Name{CommonName: names[0], Organization: ['Deevnet'],
        OrganizationUnit: ['{{ deevnet_substrate | capitalize }} Tenant Services']},
        NotBefore: now - duration('30s'),
        NotAfter: now + duration('8760h'),
        KeyUsage: 5,
        ExtKeyUsage: [ExtKeyUsage.ExtKeyUsageServerAuth],
        BasicConstraintsValid: true,
        IsCA: false,
        DNSNames: names}
  expression: >-
    !shaped ? 'every name must be <service>.<tenant>.[<site>.]{{ deevnet_root_domain }}, the sites being {{ openbao_tenant_service_sites | join(', ') }}' :
    !one_tenant ? 'a certificate names one tenant' :
    reserved ? 'the tenant label is reserved' :
    device_label ? 'device is the label of the tenant devices' :
    !unique ? 'a name is given twice' :
    extras ? 'a certificate holds DNS names only' :
    !key_ok ? 'the key must be RSA or ECDSA' :
    ValidationOutput{template: cert}

# CEL roles, written to their mounts and read back whole.
openbao_pki_cel_roles_all:
  - mount: "{{ openbao_tenant_service_mount }}"
    name: "{{ openbao_tenant_service_role }}"
    program: "{{ openbao_tenant_service_cel_program }}"
openbao_pki_cel_roles: "{{ openbao_pki_cel_roles_all }}"

# The paths on its mount the API may sign through: the CEL role's alone. The
# classic role's (sign) was granted beside it while CHG-0059 moved the API.
openbao_tenant_service_api_sign_paths: [cel/sign]

# PKI signing roles, written to their mounts. POST is idempotent.
# None since CHG-0059: the Tenant Service CA signs through its CEL role.
openbao_pki_roles_all: []
openbao_pki_roles: "{{ openbao_pki_roles_all }}"
# Classic roles to delete, as mount/name. The Tenant Service CA's, which
# admitted any name two labels below the root (CHG-0059).
openbao_retired_pki_roles:
  - {mount: "{{ openbao_tenant_service_mount }}", name: tenant-service}
# Mounts to remove: the pre-ADR-0031 `pki` mount, once nothing serves a
# certificate it issued (CHG-0033).
openbao_retired_mounts: []

# Policies, as HCL, by name. Written verbatim.
openbao_policies:
  # The Deevnet API: read its backend credentials, use its Transit key, wrap
  # and unwrap enrollment records, and have the Tenant Service CA sign through
  # its role (ADR-0037), classic or CEL (CHG-0059). It cannot read that CA's
  # key, change the role or use another. Its own certificate is the Substrate CA's, laid down by Ansible.
  deevnet-api: |
    path "{{ openbao_kv_mount }}/data/backends" { capabilities = ["read"] }
    path "transit/encrypt/{{ openbao_transit_key }}" { capabilities = ["update"] }
    path "transit/decrypt/{{ openbao_transit_key }}" { capabilities = ["update"] }
    {% if openbao_transit_key_previous | length > 0 %}path "transit/decrypt/{{ openbao_transit_key_previous }}" { capabilities = ["update"] }
    {% endif %}path "sys/wrapping/wrap" { capabilities = ["update"] }
    {% for p in openbao_tenant_service_api_sign_paths %}path "{{ openbao_tenant_service_mount }}/{{ p }}/{{ openbao_tenant_service_role }}" { capabilities = ["update"] }
    {% endfor %}
  # Ansible after bootstrap: configure mounts, auth, policies and roles, write
  # the API's backend credentials, run the issuing CAs. Not root: it cannot read
  # other tokens, generate a root, or change the seal.
  ansible: |
    path "sys/mounts" { capabilities = ["read"] }
    path "sys/mounts/*" { capabilities = ["create", "read", "update", "delete"] }
    path "sys/auth" { capabilities = ["read"] }
    path "sys/auth/*" { capabilities = ["create", "read", "update", "sudo"] }
    path "sys/policies/acl/*" { capabilities = ["create", "read", "update"] }
    path "auth/approle/role/*" { capabilities = ["create", "read", "update"] }
    path "{{ openbao_kv_mount }}/data/*" { capabilities = ["create", "read", "update"] }
    path "{{ openbao_build_kv_mount }}/data/*" { capabilities = ["create", "read", "update"] }
    path "transit/keys/*" { capabilities = ["create", "read", "update"] }
    path "transit/wrapping_key" { capabilities = ["read"] }
    path "{{ openbao_tenant_device_mount }}/*" { capabilities = ["create", "read", "update", "sudo"] }
    path "{{ openbao_tenant_service_mount }}/*" { capabilities = ["create", "read", "update", "sudo"] }

  # The image factory and the tenant fabric at build time (CHG-0026): read the
  # Proxmox tokens, and nothing else - not the API's backends, not a mount,
  # not PKI.
  image-factory: |
    path "{{ openbao_build_kv_mount }}/data/proxmox/*" { capabilities = ["read"] }

# AppRoles, by name.
# Where each AppRole may log in from, and use its token from (CHG-0036), as
# OpenBao sees the caller's address: its audit log says, and the inventory
# sets them. Empty binds nothing. Ansible's own calls on this host reach
# OpenBao through podman's bridge, so they come from its gateway; anything
# else on this host does too, so that address is only as narrow as the host.
openbao_api_cidrs: []
openbao_ansible_cidrs: []
openbao_image_factory_cidrs: []
# The API's secret ID expires, and the deevnet_api role issues a new one when
# fewer than deevnet_api_secret_id_renew_days remain.
openbao_api_secret_id_ttl: 8760h

openbao_approles:
  deevnet-api:
    token_policies: [deevnet-api]
    token_ttl: 1h
    token_max_ttl: 24h
    secret_id_ttl: "{{ openbao_api_secret_id_ttl }}"
    secret_id_bound_cidrs: "{{ openbao_api_cidrs }}"
    token_bound_cidrs: "{{ openbao_api_cidrs }}"
  # Root-equivalent in practice: it writes every policy, the others' included.
  # Its secret ID is held in the vault only.
  ansible:
    token_policies: [ansible]
    token_ttl: 30m
    token_max_ttl: 2h
    secret_id_bound_cidrs: "{{ openbao_ansible_cidrs }}"
    token_bound_cidrs: "{{ openbao_ansible_cidrs }}"
  # One build's worth: scripts/pve-creds logs in, reads once and revokes its
  # own token, so three uses and fifteen minutes is all a token ever gets.
  image-factory:
    token_policies: [image-factory]
    token_ttl: 15m
    token_max_ttl: 1h
    token_num_uses: 3
    secret_id_bound_cidrs: "{{ openbao_image_factory_cidrs }}"
    token_bound_cidrs: "{{ openbao_image_factory_cidrs }}"
