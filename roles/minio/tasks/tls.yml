---
# The state store's TLS material, from the site CA (ADR-0030, CHG-0030),
# through site_cert. A tenant's Terraform state holds every secret the
# substrate issued it, and it crosses DVNTM-TD, where laptops are isolated by IP
# but not against ARP spoofing (ADR-0029 §4) - so the state store must be TLS,
# verified against the site root the tenant already carries.
#
# site_cert talks to OpenBao from the CONTROL NODE - this VM has no path to
# OpenBao and must not need one.

# MinIO's --certs-dir layout: public.crt and private.key at the top, and CAs/
# for the CAs it trusts. Only this container mounts it, so :Z is safe; MinIO
# runs as root in the container and reads the key as root.
- name: Create the trusted-CA directory
  ansible.builtin.file:
    path: "{{ minio_tls_dir }}/CAs"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Issue the state store's certificate
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ minio_tls_dir }}"
    site_cert_cert_file: public.crt
    site_cert_key_file: private.key
    site_cert_ca_file: "CAs/{{ site_root_ca_name }}"
    site_cert_old_ca_file: CAs/site-ca.pem
    site_cert_common_name: "{{ minio_tls_common_name }}"
    site_cert_alt_names: "{{ minio_tls_alt_names }}"
    site_cert_ips: "{{ minio_tls_ips }}"
    site_cert_ttl: "{{ minio_tls_ttl }}"
    site_cert_renew_before: "{{ minio_tls_renew_before }}"
    site_cert_notify: restart minio
    site_cert_openbao_addr: "{{ minio_openbao_addr }}"
    site_cert_openbao_ca_local: "{{ minio_openbao_ca_local }}"
    site_cert_openbao_role_id: "{{ minio_openbao_ansible_role_id }}"
    site_cert_openbao_secret_id: "{{ minio_openbao_ansible_secret_id }}"
    site_cert_pki_mount: "{{ minio_openbao_pki_mount }}"
    site_cert_pki_role: "{{ minio_openbao_pki_role }}"
