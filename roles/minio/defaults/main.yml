---
# MinIO - Terraform state store offered to tenants (ADR-0007).
#
# OFFERED, NOT MANDATED. The substrate guarantees a state store exists; a tenant
# may decline it and keep local state. That opt-out is what makes the hard
# dependency acceptable - a tenant that cannot tolerate "state store down means
# I cannot apply" simply does not use it. Nothing in this role reaches into a
# tenant repository.

minio_image_name: "quay.io/minio/minio"
minio_image_tag: "RELEASE.2025-09-07T16-13-09Z"
# Pushed from the control node's image store by podman_service. The versioned
# file, so the tarball and the tag cannot disagree.
minio_tarball: "minio/minio-{{ minio_image_tag }}.tar"

minio_container_name: "minio"

minio_data_root: /srv/minio
minio_data_dir: "{{ minio_data_root }}/data"
# Policies are staged here, deliberately outside minio_data_dir: that directory
# is MinIO's object backend and should contain nothing but its own storage.
minio_policy_dir: "{{ minio_data_root }}/policies"
# This image declares no user and runs as root, unlike the PowerDNS one. The
# data directory is owned to match - see setup_directories.yml.

minio_api_port: 9000
minio_console_port: 9001
# Where both ports are published. A site whose provisioning VM runs the service
# proxy (ADR-0036) sets 127.0.0.1: the proxy is then the only way to the API
# port, and the console is reachable from this host alone.
minio_listen_address: "0.0.0.0"
minio_loopback_only: "{{ minio_listen_address is match('127[.]') }}"

# The bucket every stack's state lives in. One bucket, prefixed per consumer,
# so a single policy shape covers both the fabric and every tenant.
minio_state_bucket: tf-state
# Off for an instance that holds no Terraform state: the tenant bucket store
# beside the state store on the object storage VM (ADR-0026 §3, CHG-0068).
minio_state_bucket_enabled: true

# Root credentials come from the vault, like every other credential here. They
# are the administrative pair used to create buckets and per-tenant users; they
# are never issued to a tenant.
minio_root_user: "{{ vault_minio_root_user | default('') }}"
minio_root_password: "{{ vault_minio_root_password | default('') }}"

# ADR-0015 §6: the Deevnet API creates tenants' state users and policies itself,
# with its own admin user rather than root. Created only when its secret is in
# the vault. The policy grants user and policy administration, and (CHG-0065)
# listing and deleting every object version under the tenants' prefix, so a
# tenant's delete takes its state with it. That is still enough to grant any
# user anything, so this is a separate, rotatable credential, not a
# confinement; but it cannot itself read any state, or delete the fabric's.
# Generate with: openssl rand -hex 20
minio_api_admin_user: deevnet-api
minio_api_admin_secret: "{{ vault_minio_deevnet_api_secret | default('') }}"
minio_api_admin_policy: deevnet-api-admin
minio_api_admin_actions:
  - admin:CreateUser
  - admin:DeleteUser
  - admin:GetUser
  - admin:ListUsers
  - admin:CreatePolicy
  - admin:DeletePolicy
  - admin:GetPolicy
  - admin:AttachUserOrGroupPolicy
  - admin:ListUserPolicies
# The prefix every tenant's state sits under; the API's purge is held to it.
minio_api_tenant_state_prefix: "tenants/"

# --- TLS (CHG-0030) ------------------------------------------------------------
# Off by default so the role stays usable where there is no site PKI. On, the
# API port serves HTTPS only, with a certificate from the Substrate CA
# (ADR-0031 §4), and every client verifies it.
#
# A site that publishes on loopback behind the service proxy (ADR-0036) leaves
# it off: the proxy holds the certificate tenants verify, and this role then
# removes a certificate and key left from when MinIO served TLS itself.
minio_tls_enabled: false
minio_tls_dir: "{{ minio_data_root }}/certs"
minio_scheme: "{{ 'https' if minio_tls_enabled | bool else 'http' }}"
# Tenants dial the name; the API dials the host address; the role's own health
# check and mc dial 127.0.0.1.
minio_tls_common_name: "tfstate.{{ deevnet_substrate | default('') }}.{{ deevnet_root_domain | default('') }}"
minio_tls_alt_names:
  - "{{ inventory_hostname }}.{{ deevnet_substrate | default('') }}.{{ deevnet_root_domain | default('') }}"
minio_tls_ips:
  - "{{ env.interfaces.eth0.ip | default('') }}"
  - 127.0.0.1
minio_tls_renew_before: 5184000
