---
# The service proxy's TLS certificate from the Substrate CA (ADR-0031 §4),
# through site_cert. The host's one server certificate for the services behind
# the proxy: it names the host, every alias and every address.
#
# site_cert signs it on the CONTROL NODE: this VM needs no path to anything.
- name: Issue the service proxy's certificate
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ service_proxy_tls_dir }}"
    site_cert_key_owner: root
    site_cert_common_name: "{{ service_proxy_tls_common_name }}"
    site_cert_alt_names: "{{ service_proxy_tls_alt_names }}"
    site_cert_ips: "{{ service_proxy_tls_ips }}"
    site_cert_renew_before: "{{ service_proxy_tls_renew_before }}"
    site_cert_notify: restart service proxy
