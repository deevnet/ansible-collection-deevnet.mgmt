---
- name: Deploy pdns.conf
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: "{{ powerdns_config_dir }}/pdns.conf"
    owner: root
    group: root
    mode: '0644'
  notify: restart pdns-auth
  become: true
  # The file carries the HTTP API key when the API is on; a --diff run must not
  # print it.
  diff: false
