---
# The broker's TLS certificate from the site CA (ADR-0030), through site_cert.
# MQTT is TLS only (CHG-0015): without a certificate the broker has no listener.
#
# site_cert talks to OpenBao from the CONTROL NODE, against the pinned listener
# certificate, as Ansible's own AppRole - this VM has no path to OpenBao and
# must not need one.
- name: Issue The broker's certificate
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ vernemq_tls_dir }}"
    site_cert_cert_file: broker.pem
    site_cert_key_file: broker-key.pem
    site_cert_key_owner: "{{ vernemq_uid }}"
    site_cert_common_name: "{{ vernemq_tls_common_name }}"
    site_cert_alt_names: "{{ vernemq_tls_alt_names }}"
    site_cert_ips: "{{ [vernemq_tls_ip] }}"
    site_cert_ttl: "{{ vernemq_tls_ttl }}"
    site_cert_renew_before: "{{ vernemq_tls_renew_before }}"
    site_cert_notify: restart vernemq
    site_cert_openbao_addr: "{{ vernemq_openbao_addr }}"
    site_cert_openbao_ca_local: "{{ vernemq_openbao_ca_local }}"
    site_cert_openbao_role_id: "{{ vernemq_openbao_ansible_role_id }}"
    site_cert_openbao_secret_id: "{{ vernemq_openbao_ansible_secret_id }}"
    site_cert_pki_mount: "{{ vernemq_openbao_pki_mount }}"
    site_cert_pki_role: "{{ vernemq_openbao_pki_role }}"
