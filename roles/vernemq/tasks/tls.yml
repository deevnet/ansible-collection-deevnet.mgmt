---
# The broker's TLS certificate from the Substrate CA (ADR-0031 §4), through site_cert.
# MQTT is TLS only (CHG-0015): without a certificate the broker has no listener.
#
# site_cert signs it on the CONTROL NODE: this VM needs no path to anything.
- name: Issue The broker's certificate
  ansible.builtin.include_role:
    name: site_cert
  vars:
    site_cert_dir: "{{ vernemq_tls_dir }}"
    site_cert_cert_file: broker.pem
    site_cert_key_file: broker-key.pem
    site_cert_key_owner: "{{ vernemq_uid }}"
    site_cert_common_name: "{{ vernemq_tls_common_name }}"
    site_cert_alt_names: "{{ vernemq_tls_alt_names }}"
    site_cert_ips: "{{ [vernemq_tls_ip] }}"
    site_cert_renew_before: "{{ vernemq_tls_renew_before }}"
    site_cert_notify: restart vernemq
