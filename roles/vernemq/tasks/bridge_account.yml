---
# The log bridge's broker account (ADR-0027 §4, CHG-0021).
#
# Written here, by the substrate, rather than by the Deevnet API's account
# writer. The writer's contract is that every pattern sits under one tenant's
# prefix, which is what keeps tenants apart; this account's whole job is to
# span them. Relaxing the writer for it would put a hole in the rule that
# matters most, so the one account that is not a tenant's is provisioned beside
# the schema and the database roles, which are the other things here that
# belong to no tenant.
#
# What confines it instead:
#   - it may SUBSCRIBE and not publish
#   - to one filter, `+/log/#`, which is every tenant's reserved log level and
#     nothing else (the + is one whole level, so it cannot reach past a
#     tenant's prefix)
#   - its client id is pinned, so the credential is not usable by another
#     client
#   - the API refuses any other use of that level (ADR-0027 §3)

- name: Check the bridge account's name and password
  ansible.builtin.assert:
    that:
      - vernemq_bridge_password | length >= 24
      # The password is interpolated into SQL below. It is generated by us, so
      # this is not a guard against an attacker - it is a guard against a
      # quote or a backslash in a hand-edited vault turning a provisioning run
      # into a syntax error, or worse, a different statement.
      - vernemq_bridge_password is match('^[A-Za-z0-9._-]+$')
      # A tenant name is at most 8 characters (ADR-0002) and the API's
      # usernames are "<tenant>-<account>", so a first segment of 9 or more
      # cannot be minted by the API. Checked rather than assumed, because the
      # cost of a collision is one party silently overwriting the other's
      # credential.
      - (vernemq_bridge_username.split('-') | first | length) > 8
    fail_msg: >-
      vault_vernemq_bridge_password must be at least 24 characters of
      [A-Za-z0-9._-] (openssl rand -hex 24), and vernemq_bridge_username's
      first segment must be longer than a tenant name can be, so it cannot
      collide with an account the Deevnet API issues.
  no_log: true

# One rendering of the ACL document, used by the write and by the guard that
# decides whether the write changes anything. Written twice, they would drift
# and the task would report changed for ever.
- name: Render the bridge's subscribe ACL
  ansible.builtin.set_fact:
    vernemq_bridge_subscribe_json: >-
      {{ vernemq_bridge_subscribe | map('community.general.dict_kv', 'pattern') | list | to_json }}

# Upserted, and deliberately NOT unconditionally: the WHERE guard makes this
# idempotent, so a run that changes nothing reports nothing, and a rotated
# password in the vault still reaches the database.
#
# crypt()/gen_salt('bf') is the same server-side hashing every other account on
# this broker uses (ADR-0012 §8): PostgreSQL pays for the hash, not the broker.
- name: Write the bridge's account
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - --interactive
      - "{{ vernemq_db_container_name }}"
      - psql
      - --username={{ vernemq_db_admin_user }}
      - --dbname={{ vernemq_db_name }}
      - --set=ON_ERROR_STOP=1
      - --tuples-only
      - --no-align
      - --quiet
    stdin: |
      INSERT INTO vmq_auth_acl
             (mountpoint, client_id, username, password, publish_acl, subscribe_acl)
      VALUES ('', '{{ vernemq_bridge_client_id }}', '{{ vernemq_bridge_username }}',
              crypt('{{ vernemq_bridge_password }}', gen_salt('bf')),
              '[]'::json,
              '{{ vernemq_bridge_subscribe_json }}'::json)
      ON CONFLICT (mountpoint, client_id, username) DO UPDATE
         SET password      = EXCLUDED.password,
             publish_acl   = EXCLUDED.publish_acl,
             subscribe_acl = EXCLUDED.subscribe_acl
       WHERE vmq_auth_acl.password IS DISTINCT FROM crypt('{{ vernemq_bridge_password }}', vmq_auth_acl.password)
          OR vmq_auth_acl.publish_acl::text   IS DISTINCT FROM '[]'
          OR vmq_auth_acl.subscribe_acl::text IS DISTINCT FROM
             '{{ vernemq_bridge_subscribe_json }}'
      RETURNING 'written';
  register: vernemq_bridge_write
  changed_when: vernemq_bridge_write.stdout is search('written')
  become: true
  no_log: true

# Read back, because the statement above is written with no_log and a silent
# no-op and a silent failure look the same in the recap. This asserts what the
# broker will actually enforce, not what was sent.
- name: Read the bridge's account back
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ vernemq_db_container_name }}"
      - psql
      - --username={{ vernemq_db_admin_user }}
      - --dbname={{ vernemq_db_name }}
      - --tuples-only
      - --no-align
      - --command=SELECT client_id || ' | ' || coalesce(publish_acl::text, 'null') || ' | ' || coalesce(subscribe_acl::text, 'null')
                    FROM vmq_auth_acl WHERE username = '{{ vernemq_bridge_username }}'
  register: vernemq_bridge_row
  changed_when: false
  become: true

- name: Confirm the bridge may only subscribe, and only to the log level
  ansible.builtin.assert:
    that:
      - vernemq_bridge_row.stdout | trim | length > 0
      - vernemq_bridge_row.stdout is search('\[\]')
      - vernemq_bridge_row.stdout is search('\+/log/#')
      - vernemq_bridge_row.stdout is search(vernemq_bridge_client_id)
    fail_msg: >-
      The bridge's account is not what it should be. Expected client id
      {{ vernemq_bridge_client_id }}, an empty publish list and a subscribe
      list of {{ vernemq_bridge_subscribe }}, and the database holds:
      {{ vernemq_bridge_row.stdout | default('no row at all') }}
    quiet: true
