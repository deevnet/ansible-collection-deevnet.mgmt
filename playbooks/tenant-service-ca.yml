# The site's Tenant Service CA in OpenBao (ADR-0037), on its own (CHG-0047):
# the CA that signs server certificates for names in a tenant's own zone.
# Run with the inventory decrypted (Ansible's AppRole is in the vault):
#
#   ansible-playbook playbooks/tenant-service-ca.yml
#
# It imports the CA from the vault (ADR-0042 §4, CHG-0036): the key in
# vault_tenant_service_ca_key, made by playbooks/tenant-cas.yml, and the
# certificate the Issuing CA ceremony signed,
# pki/<site>/deevnet-<site>-tenant-service-ca.pem, with the Site CA. It checks the two are a pair first, then makes the imported issuer the
# default. A run that finds the mount already serving that certificate
# changes nothing.
#
# Every run also writes the one role the CA signs through, which a mount with
# no CA yet cannot use.
#
# playbooks/openbao.yml runs the same steps as part of the whole role.
- name: The Tenant Service CA
  hosts: openbao
  gather_facts: false
  # As playbooks/openbao.yml: the listener's files are readable by root only.
  become: true
  tasks:
    - name: Run it
      ansible.builtin.include_role:
        name: openbao
        tasks_from: issuing_ca_only.yml
      vars:
        openbao_ca_only: tenant-service
