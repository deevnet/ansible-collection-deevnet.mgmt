# The site's Tenant Device CA in OpenBao (ADR-0031 §3), on its own (CHG-0033).
# Run with the inventory decrypted (Ansible's AppRole is in the vault):
#
#   ansible-playbook playbooks/tenant-device-ca.yml
#
# It imports the CA from the vault (ADR-0042 §4, CHG-0036): the key in
# vault_tenant_device_ca_key, made by playbooks/tenant-cas.yml, and the
# certificate the Issuing CA ceremony signed,
# pki/<site>/deevnet-<site>-tenant-device-ca.pem, with the Site CA. It checks the two are a pair first, then makes the imported issuer the
# default. A run that finds the mount already serving that certificate
# changes nothing.
#
# playbooks/openbao.yml runs the same steps as part of the whole role.
- name: The Tenant Device CA
  hosts: openbao
  gather_facts: false
  # As playbooks/openbao.yml: the listener's files are readable by root only.
  become: true
  tasks:
    - name: Run it
      ansible.builtin.include_role:
        name: openbao
        tasks_from: issuing_ca_only.yml
      vars:
        openbao_ca_only: tenant-device
