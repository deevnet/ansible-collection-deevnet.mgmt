---
# Every substrate certificate and trust anchor, across the site (ADR-0031 §7,
# ADR-0030 §6). This is how the operator renews: re-run it. Each step issues
# only what is missing, within 60 days of expiry, or no longer chaining to the
# Deevnet Root CA, so a run with nothing to do changes nothing.
#
#   ansible-playbook playbooks/certs.yml
#   ansible-playbook playbooks/certs.yml --limit dv02obs001v01
#
# It renews; it does not configure. A service whose configuration names its
# certificate files (a first build, or CHG-0031's rename) is set up by site.yml.
# Every certificate is signed on the control node by the site's Substrate CA
# (deevnet.builder.substrate_cert), OpenBao's listener included: nothing here
# depends on OpenBao (ADR-0031 §4). The log bridge holds only the root, which a
# renewal never changes.
#
# Needs the inventory decrypted (the Substrate CA's key is in the vault), and
# deevnet.builder and deevnet.net published (make publish in each).

- name: Trust the Deevnet Root CA
  hosts: builder:hypervisors:management_plane
  become: true
  tags: [trust]
  roles:
    - deevnet.builder.site_trust

# Before OpenBao: the hypervisors run it.
- name: The hypervisors' web UI and API
  hosts: hypervisors
  become: true
  tags: [hypervisors]
  roles:
    - deevnet.builder.proxmox_node_cert

# The core router's web GUI and API. The role imports and checks; choosing the
# certificate in the GUI is a manual step the first time (runbook: Certificates).
- name: The core router
  hosts: dns_servers
  gather_facts: false
  tags: [router]
  roles:
    - deevnet.net.opnsense_cert

# OpenBao's listener certificate, and its Tenant Device CA.
- name: OpenBao
  hosts: openbao
  become: true
  tags: [openbao]
  roles:
    - openbao

- name: The Deevnet API
  hosts: deevnet_api
  become: true
  tasks:
    - name: Issue the API certificate
      ansible.builtin.include_role:
        name: deevnet_api
        tasks_from: openbao.yml

- name: The tenant state store
  hosts: tenant_state
  become: true
  tasks:
    - name: Issue the state store's certificate
      ansible.builtin.include_role:
        name: minio
        tasks_from: tls.yml
      when: minio_tls_enabled | default(false) | bool

- name: The broker
  hosts: mqtt_brokers
  become: true
  tasks:
    - name: Issue the broker certificate
      ansible.builtin.include_role:
        name: vernemq
        tasks_from: tls.yml

# The one certificate for the services behind it: the log store, Grafana, the
# tenant downloads and the state store hold none of their own (ADR-0036).
- name: The service proxy
  hosts: service_proxy
  become: true
  tasks:
    - name: Issue the service proxy's certificate
      ansible.builtin.include_role:
        name: service_proxy
        tasks_from: tls.yml

    - name: Restart now if the certificate changed
      ansible.builtin.meta: flush_handlers

- name: The Omada controller
  hosts: network_controllers:&management_plane
  become: true
  tags: [omada]
  tasks:
    - name: Issue the controller's certificate
      ansible.builtin.include_role:
        name: omada_controller
        tasks_from: tls.yml
      when: omada_tls_enabled | default(false) | bool

    - name: Restart now if the certificate changed
      ansible.builtin.meta: flush_handlers

    - name: Wait for the controller to answer over verified TLS
      ansible.builtin.uri:
        url: "https://127.0.0.1:8043/api/info"
        ca_path: "{{ omada_data_root | default('/opt/omada-controller') }}/cert/{{ site_root_ca_name }}"
      register: _omada_info
      retries: 40
      delay: 15
      until: _omada_info.status is defined and _omada_info.status == 200
      when: omada_tls_enabled | default(false) | bool
