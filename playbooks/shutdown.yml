---
# Substrate shutdown, in dependency order, up to the hypervisors.
#
# Usage, from the Builder:
#   cd ansible-collection-deevnet.mgmt
#   ansible-playbook playbooks/shutdown.yml -e confirm_shutdown=yes
#
# The ordering IS this playbook. Each stage is the next one's dependency, so each
# must be fully down - verified, not assumed - before the next begins:
#
#   1. guests        every qemu VM on both hypervisors
#   2. hypervisors   dv02hyp001p01, dv02hyp002p02
#   3. pis           the `pis` group
#
# The rest is the operator's, by hand, once this has finished (runbook:
# Lifecycle > Shutdown and Power-On):
#
#   4. the Builder       sudo shutdown -h now, on the Builder itself
#   5. the core router   halted from its web interface
#
# The playbook stops short of both on purpose. The Builder is where it runs and
# where its output is read, and the core router is the network the operator's
# own computer reaches its web interface through; each is easier to watch go
# down by hand, and neither has anything left that depends on it.
#
# Stage 1 enumerates guests from the PVE API rather than from inventory, because a
# hypervisor cannot safely halt while ANY guest is running - including guests that
# were never in inventory. The service VMs (ADR-0013) need no listing here for
# the same reason: whatever is running is what gets stopped.
#
# Within a hypervisor, Stage 1 stops guests the way PVE itself would at node
# shutdown: in reverse of each guest's startup order, and waiting each guest's own
# `down` timeout. Those values are declared per VM in inventory (mgmt_vm.startup),
# so tenant DNS (order 10) is the last guest down on dv02hyp001p01 and the Omada
# controller gets the 150s its container stop needs.
#
# Never shut down, by this playbook or by hand: the access switch (dv02acc001p01),
# the Omada AP (dv02wap001p01) and the edge router (dv02edg001p01). Their power is
# simply cut once everything else is off.
#
# There is no matching startup playbook and there does not need to be: once each
# machine is powered on, its VMs come back on their own (onboot, proxmox_vm).

- name: Confirm intent
  # The control node itself, not `localhost`. group_vars/all derives ansible_host
  # from env.interfaces, which the implicit localhost does not have, so a play
  # targeting localhost dies computing its own connection address before it ever
  # reaches the assert - aborting for the right outcome but entirely the wrong
  # reason, and just as fatally when the confirmation IS supplied.
  hosts: dv00bld001p01
  gather_facts: false
  connection: local
  become: false
  # Without this the guard below does not guard anything. A failed assert marks
  # localhost failed, and Ansible carries on into the next play - which targets
  # different hosts and so is entirely unaffected. any_errors_fatal is what turns
  # one failed host into an aborted playbook.
  any_errors_fatal: true
  tasks:
    # A playbook that powers off the entire substrate must not be one keystroke of
    # shell history away from running by accident, and `--check` is no protection
    # here - a shutdown is not a check-mode-aware operation.
    - name: Require an explicit confirmation
      ansible.builtin.assert:
        that:
          - confirm_shutdown | default('') == 'yes'
        fail_msg: >-
          This powers off every VM, both hypervisors and the pis. Re-run with
          -e confirm_shutdown=yes if that is what you want.
        success_msg: "Confirmed. Shutting down the substrate."

- name: Stage 1 - shut down every guest on every hypervisor
  hosts: hypervisors
  gather_facts: false
  # Every call here is to the PVE API, not to the hypervisor's shell, so nothing
  # in this play needs SSH to the node.
  connection: local
  become: false
  tasks:
    - name: Enumerate qemu guests on {{ proxmox_node }}
      community.general.proxmox_vm_info:
        api_host: "{{ ansible_host }}"
        api_user: "{{ proxmox_token_id.split('!')[0] }}"
        api_token_id: "{{ proxmox_token_id.split('!')[1] }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        validate_certs: "{{ site_verify_proxmox | default(false) }}"
        node: "{{ proxmox_node }}"
        type: qemu
        # The startup order and shutdown timeout live in the guest config, which
        # the default listing does not return.
        config: current
      register: shutdown_guest_inventory

    # Filtering on status alone, deliberately: a PVE template cannot run, so it is
    # already excluded by status != running. Testing `template` instead would need
    # a `selectattr('template', 'defined')` guard first, because the key is absent
    # on ordinary guests and rejectattr raises on a missing attribute rather than
    # treating it as false.
    - name: Select the running guests
      ansible.builtin.set_fact:
        shutdown_running_guests: >-
          {{
            shutdown_guest_inventory.proxmox_vms
            | default([])
            | selectattr('status', 'defined')
            | selectattr('status', 'equalto', 'running')
            | list
          }}

    # PVE's own rules, from the admin guide ("Start and Shutdown Order"):
    #   - "We use the reverse startup order for shutdown"
    #   - "If multiple VMs have the same order defined on a host, they will
    #     additionally be ordered by VMID in ascending order"
    #   - "machines without a Start/Shutdown order parameter will always start
    #     after those where the parameter is set"
    #   - the shutdown timeout defaults to 180
    # So the start sequence sorts on (no order, order, vmid), and shutdown is that
    # sequence reversed: unordered guests first, then highest order first.
    #
    # startup is "[[order=]N][,up=N][,down=N]" - the order key is optional, so a
    # bare leading number is an order too. The sort key is a zero-padded string
    # because values templated into a fact's dict would otherwise sort as text.
    - name: Order the running guests for shutdown on {{ proxmox_node }}
      ansible.builtin.set_fact:
        shutdown_ordered_guests: >-
          {{
            shutdown_ordered_guests | default([]) + [{
              'vmid': item.vmid,
              'name': item.name,
              'order': shutdown_order,
              'timeout': (shutdown_down | default(shutdown_guest_timeout | default(180), true)) | int,
              'label': item.name ~ ' (order ' ~ (shutdown_order | default('none', true)) ~ ', '
                       ~ (shutdown_down | default(shutdown_guest_timeout | default(180), true)) ~ 's)',
              'key': '%d-%09d-%09d' | format(
                (shutdown_order == '') | ternary(1, 0),
                shutdown_order | default(0, true) | int,
                item.vmid | int),
            }]
          }}
      loop: "{{ shutdown_running_guests }}"
      loop_control:
        label: "{{ item.name }} (vmid {{ item.vmid }})"
      vars:
        shutdown_startup: >-
          {{ ((item.config | default({})).startup | default('')).split(',')
             | map('trim') | reject('equalto', '') | list }}
        shutdown_order: >-
          {{ shutdown_startup | select('match', '^(order=)?[0-9]+$')
             | map('regex_replace', '^order=', '') | first | default('') }}
        shutdown_down: >-
          {{ shutdown_startup | select('match', '^down=[0-9]+$')
             | map('regex_replace', '^down=', '') | first | default('') }}

    - name: Report the shutdown sequence on {{ proxmox_node }}
      ansible.builtin.debug:
        msg: >-
          {{ proxmox_node }}:
          {{ shutdown_ordered_guests | default([]) | sort(attribute='key', reverse=true)
             | map(attribute='label') | join(', ') | default('nothing running', true) }}

    # This posts to PVE's status/shutdown, which is a graceful request - through the
    # guest agent when it is running, an ACPI powerdown otherwise - NOT a virtual
    # power cord. `force` does not change that request; it decides what happens when
    # `timeout` runs out. PVE's _do_vm_stop (qemu-server; read on the PVE 8 branch,
    # stable-bookworm, and on master):
    #   force (forceStop=1):  "VM still running - terminating now with SIGTERM"
    #   no force:             "VM quit/powerdown failed - got timeout", VM left running
    # Without force, one guest that ignores the request fails this play for its
    # hypervisor. Stage 2 then skips that node, and the operator, told every
    # hypervisor is down, would take the network away under it.
    - name: Gracefully shut down each running guest, in order
      community.general.proxmox_kvm:
        api_host: "{{ ansible_host }}"
        api_user: "{{ proxmox_token_id.split('!')[0] }}"
        api_token_id: "{{ proxmox_token_id.split('!')[1] }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        validate_certs: "{{ site_verify_proxmox | default(false) }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ item.vmid }}"
        state: stopped
        force: true
        timeout: "{{ item.timeout }}"
      loop: "{{ shutdown_ordered_guests | default([]) | sort(attribute='key', reverse=true) }}"
      loop_control:
        label: "{{ item.name }} (vmid {{ item.vmid }}, {{ item.timeout }}s)"

    # Asserts the outcome rather than trusting the API's `changed`. The next stage
    # halts these nodes, and a guest still flushing its filesystem when its
    # hypervisor cuts out is exactly the corruption this ordering exists to avoid.
    - name: Wait until no guest is running on {{ proxmox_node }}
      community.general.proxmox_vm_info:
        api_host: "{{ ansible_host }}"
        api_user: "{{ proxmox_token_id.split('!')[0] }}"
        api_token_id: "{{ proxmox_token_id.split('!')[1] }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        validate_certs: "{{ site_verify_proxmox | default(false) }}"
        node: "{{ proxmox_node }}"
        type: qemu
      register: shutdown_guest_check
      until: >-
        shutdown_guest_check.proxmox_vms
        | default([])
        | selectattr('status', 'defined')
        | selectattr('status', 'equalto', 'running')
        | list | length == 0
      retries: 30
      delay: 10

- name: Stage 2 - power off the hypervisors
  hosts: hypervisors
  gather_facts: false
  become: true
  tasks:
    # async/poll:0 because the node stops answering mid-command: the SSH session
    # dies with the box, and a synchronous task would report that as a failure.
    # ignore_unreachable covers a node that is already off, which is a success
    # for our purposes, not an error.
    - name: Issue poweroff
      ansible.builtin.command:
        cmd: /sbin/shutdown -h now "substrate shutdown"
      async: 1
      poll: 0
      changed_when: true
      failed_when: false
      ignore_unreachable: true

    - name: Wait for {{ inventory_hostname }} to stop answering
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: stopped
        timeout: 300
      delegate_to: localhost
      become: false

- name: Stage 3 - power off the pis
  hosts: pis
  gather_facts: false
  become: true
  tasks:
    - name: Issue poweroff
      ansible.builtin.command:
        cmd: /sbin/shutdown -h now "substrate shutdown"
      async: 1
      poll: 0
      changed_when: true
      failed_when: false
      ignore_unreachable: true

    - name: Wait for {{ inventory_hostname }} to stop answering
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: stopped
        timeout: 300
      delegate_to: localhost
      become: false

- name: Hand over to the operator
  hosts: dv00bld001p01
  gather_facts: false
  connection: local
  become: false
  tasks:
    - name: Say what is left
      ansible.builtin.debug:
        msg:
          - "Every VM, both hypervisors and the Pis are down."
          - "Next, by hand: on the Builder, sudo shutdown -h now."
          - "Then halt the core router from its web interface."
          - "The access switch, AP and edge router need no shutdown: cut their power."
