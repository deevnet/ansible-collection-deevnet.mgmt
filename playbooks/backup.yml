---
# Operate the backup job (CHG-0039). The role installs it (site.yml --tags backup);
# this runs it, checks it, and proves an archive can be read back.
#
#   make backup-status    the last good backup, and fail if one is due and the
#                         host has been up long enough to have taken it
#   make backup-now       run the job now, whatever the interval, then report
#   make backup-dry-run   build and encrypt an archive with no drive attached
#   make backup-verify    decrypt the newest archive with the key from the vault
#                         and check it against its own manifest (SOURCE=dry-run
#                         reads the dry run's archive instead of the drive's)
#
# backup-verify is the only thing here that reads the private key. It is held in
# memory on the host for the length of the check and removed whatever happens.

- name: Operate the backup job
  hosts: backup
  become: true
  gather_facts: false
  vars:
    backup_action: status
    backup_verify_source: drive
  tasks:
    - name: Load the backup role's defaults
      ansible.builtin.include_role:
        name: backup
        defaults_from: main
        tasks_from: noop
        public: true

    - name: Check the action
      ansible.builtin.assert:
        that:
          - backup_action in ['status', 'run', 'dry-run', 'verify']
          - backup_verify_source in ['drive', 'dry-run']

    - name: Run the backup job
      ansible.builtin.command:
        cmd: "{{ backup_script }}{{ ' --dry-run' if backup_action == 'dry-run' else '' }}"
      register: backup_run
      changed_when: true
      when: backup_action in ['run', 'dry-run']

    - name: Show what the run reported
      ansible.builtin.debug:
        msg: "{{ backup_run.stdout_lines }}"
      when: backup_action in ['run', 'dry-run']

    # --- verify --------------------------------------------------------------
    - name: Verify the newest archive
      when: backup_action == 'verify'
      block:
        - name: Fail without the private key
          ansible.builtin.assert:
            that: backup_age_identity is match('^AGE-SECRET-KEY-1[0-9A-Z]+$')
            fail_msg: >-
              vault_backup_age_identity is empty or not an age private key. The
              inventory must be decrypted, and the key present in
              group_vars/backup/vault.yml.
          no_log: true

        - name: Make a working directory in memory
          ansible.builtin.tempfile:
            state: directory
            path: /run
            prefix: deevnet-backup-verify.
          register: backup_verify_dir

        - name: Place the private key there for the check
          ansible.builtin.copy:
            content: "{{ backup_age_identity }}\n"
            dest: "{{ backup_verify_dir.path }}/identity"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Decrypt the newest archive and check it against its manifest
          ansible.builtin.command:
            cmd: "{{ backup_verify_script }} {{ backup_verify_source }} {{ backup_verify_dir.path }}/identity"
          register: backup_verify
          changed_when: false

        - name: Show what was verified
          ansible.builtin.debug:
            msg: "{{ backup_verify.stdout_lines }}"
      always:
        - name: Remove the key and the decrypted copy
          ansible.builtin.file:
            path: "{{ backup_verify_dir.path }}"
            state: absent
          when: backup_verify_dir.path is defined

    # --- status --------------------------------------------------------------
    - name: Read the last good backup
      ansible.builtin.slurp:
        src: "{{ backup_state_dir }}/last-success"
      register: backup_last
      failed_when: false
      when: backup_action in ['status', 'run']

    - name: Read the job's last result and the host's uptime
      ansible.builtin.shell:
        cmd: |
          systemctl show deevnet-backup.service --property=Result --value
          cut -d. -f1 /proc/uptime
      register: backup_unit
      changed_when: false
      when: backup_action in ['status', 'run']

    # Due and overdue are different things on a kit that is mostly off. A backup
    # is due when the newest is older than the interval; it is overdue, and this
    # fails, only once the host has been up long enough to have taken one.
    - name: Report, and fail when a due backup has not been taken
      vars:
        _last: >-
          {{ dict((backup_last.content | default('') | b64decode).splitlines()
                  | select('match', '.+=.*') | map('split', '=', 1)) }}
        _age_hours: >-
          {{ ((now().timestamp() - (_last.epoch | default(0) | int)) / 3600) | round(1) }}
        _up_hours: "{{ ((backup_unit.stdout_lines[1] | int) / 3600) | round(1) }}"
        _due: "{{ _last.epoch is not defined or _age_hours | float > backup_interval_hours | float }}"
        _summary: >-
          {{ 'No backup has ever succeeded on this host.' if _last.epoch is not defined
             else 'Newest good backup: ' ~ _last.archive ~ ', ' ~ _age_hours ~ ' hours old, '
                  ~ _last.bytes ~ ' bytes, ' ~ _last.kept ~ ' archives on drive ' ~ _last.drive_uuid ~ '.' }}
      ansible.builtin.assert:
        that:
          - not (_due | bool) or _up_hours | float < backup_status_grace_hours | float
        fail_msg: >-
          {{ _summary }} One is due (the interval is {{ backup_interval_hours }} hours) and the
          host has been up {{ _up_hours }} hours without taking it; the last check ended
          "{{ backup_unit.stdout_lines[0] }}". Is the drive attached?
          `journalctl -u deevnet-backup.service` on the host gives the reason, on the line that
          starts "deevnet-backup: FAILED".
        success_msg: >-
          {{ _summary }}
          {{ 'One is due; the host has been up ' ~ _up_hours ~ ' hours and the next check takes it.'
             if _due | bool else 'None is due for ' ~ ((backup_interval_hours | float) - (_age_hours | float)) | round(1) ~ ' hours.' }}
      when: backup_action in ['status', 'run']
