---
# Main playbook for the deevnet.mgmt collection.
#
# Management-plane services are Ansible-only by design: they carry no Terraform
# state (architecture/substrate/management-plane/extended-services.md section 5).
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --limit tenant_dns
#   ansible-playbook playbooks/site.yml --limit deevnet_api
#   ansible-playbook playbooks/site.yml --tags tenant-dns   # zones/keys only
#   ansible-playbook playbooks/site.yml --tags tenant-state # buckets/creds only

- name: Create management-plane VMs
  hosts: management_plane
  gather_facts: false
  # Tagged so VM creation and service configuration can run as separate steps:
  #   --tags vms        create the VMs only
  #   --skip-tags vms   configure services on VMs that already exist
  tags: [vms]
  # The guest does not exist on the first run, so the PVE calls are delegated to
  # the control node; the role gathers facts itself once the VM answers on SSH.
  roles:
    # Not every management-plane host is cloned from a template. A PXE-installed
    # member declares an identity (VMID -> MAC -> DHCP reservation) and nothing
    # else, so it belongs in this group for the allocator, addressing and DNS, but
    # has no `mgmt_vm.hypervisor` and must not be handed to proxmox_vm - which
    # would fail its opening assert on the missing node.
    - role: proxmox_vm
      when: mgmt_vm.hypervisor is defined

    # Guest-side half of proxmox_vm's data disk. Runs in the same play so it reuses
    # the facts proxmox_vm gathered once the guest answered; skips itself when the
    # host declares no data disk.
    - role: data_disk
      when: mgmt_vm.data_disk is defined

# Substrate secrets (ADR-0016), in the identity VM. First among the services:
# the API reads its credentials, keys and certificate from it.
- name: Configure OpenBao
  hosts: openbao
  become: true
  tags: [openbao]
  roles:
    - openbao

# Tenant authoritative DNS (ADR-0004), in the identity VM (ADR-0013 §6).
- name: Configure tenant authoritative DNS
  hosts: tenant_dns
  become: true
  roles:
    - powerdns

# Tenant Terraform state store (ADR-0007), in the provisioning VM (ADR-0013 §6).
- name: Configure the tenant Terraform state store
  hosts: tenant_state
  become: true
  roles:
    - minio

# The Deevnet API and its database (ADR-0012), in the provisioning VM.
- name: Configure the Deevnet API
  hosts: deevnet_api
  tags: [deevnet-api]
  become: true
  roles:
    - deevnet_api

# The site's Omada controller, in the network management VM (ADR-0013 §7).
#
# Intersected with management_plane so this role can only ever land on a
# domain VM. The Builder's controller is deevnet.builder's cold fallback and is
# never touched from here, even if the Builder is put back in the group.
- name: Configure the Omada controller
  hosts: network_controllers:&management_plane
  become: true
  roles:
    - omada_controller

# The MQTT broker for custom-firmware embedded devices. Substrate rather than a
# tenant service: MQTT clients always dial the broker, so its segment must
# accept inbound, and the tenant fabric has no inbound path by design.
#
# The group is held empty until the vault carries the broker's secrets, for
# the same reason openbao's was: the role refuses to run without them, and a
# member here would stop every site.yml run on that host. Adding
# dv02msg001v01 to mqtt_brokers IS the deploy step (CHG-0015).
- name: Configure the MQTT broker
  hosts: mqtt_brokers
  become: true
  tags: [mqtt-broker]
  roles:
    - vernemq

# The MQTT log bridge (ADR-0027 §4, CHG-0021): device logs from the broker into
# each tenant's (index, 2) partition. Its own group rather than mqtt_brokers,
# for the reason every other group here is held empty until its secrets exist -
# the role refuses to run without both credentials, and a member here would
# stop every site.yml run on that host. It IS the messaging VM: the bridge runs
# beside the broker so it subscribes locally and writes over a zone rule that
# is already declared.
- name: Configure the MQTT log bridge
  hosts: log_bridges
  become: true
  tags: [log-bridge]
  roles:
    - log_bridge

# The central log store (ADR-0022, CHG-0018): VictoriaLogs behind vmauth in the
# observability store VM. The collector VM (observability_collectors) is built
# empty; its tooling is ADR-0023's change.
- name: Configure the log store
  hosts: observability_store
  become: true
  tags: [log-store]
  roles:
    - victorialogs

# Tenant dashboards (ADR-0024, CHG-0024): Grafana beside the log store. The
# server only; each tenant's organisation is the Deevnet API's to create.
- name: Configure the dashboard server
  hosts: observability_store
  become: true
  tags: [dashboards]
  roles:
    - grafana

# Tenant developer downloads (CHG-0025): the provider, Terraform, Pi Imager,
# MicroPython and the take-home Pi image, served read-only to DVNTM-TD.
- name: Configure the tenant downloads server
  hosts: observability_store
  become: true
  tags: [tenant-downloads]
  roles:
    - tenant_downloads

