namespace: deevnet
name: mgmt
version: 1.0.0
readme: README.md
authors:
  - Chris Deever
license:
  - Apache-2.0
tags:
  - ansible
  - infrastructure
  - monitoring
  - logging
  - grafana
  - observability
description: >
  Roles for management plane services including centralized logging,
  monitoring, and observability. Provides Grafana dashboards, log
  aggregation, and related management infrastructure.
dependencies:
  ansible.posix: ">=1.5.0"
  # proxmox_kvm / proxmox_vm_info, used by the proxmox_vm role to clone
  # management-plane VMs from Packer-built templates.
  # Below 11, which moved the proxmox modules to community.proxmox.
  community.general: ">=8.0.0,<11.0.0"
  # openssl_privatekey_pipe / openssl_csr_pipe, in the CA playbooks.
  community.crypto: ">=2.0.0"

# Never packed into the built collection. .openbao/ holds what the control node
# keeps of OpenBao: listener pins, and on a first initialisation or a seal
# migration the init output or the unseal shares, until they are locked in
# (CHG-0053). .ansible/ is the local install tree; packing it nested a copy of
# the collection, and those files, inside itself on every build.
build_ignore:
  - .openbao
  - .ansible
  - "*.tar.gz"
  - .deps.stamp
